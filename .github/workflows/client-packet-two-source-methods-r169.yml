name: V309 original Packet signed short and float wrapper R169
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_packet_partial_methods_r169.py"
      - "tests/test_private_v309_packet_partial_methods_r169.py"
      - ".github/workflows/client-packet-two-source-methods-r169.yml"
  workflow_dispatch:
jobs:
  packet-partial:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_private_v309_packet_partial_methods_r169.py" -v
      - run: python -m unittest discover -s tests -p "test_private_v309_math_source_closure_r168.py" -v
      - run: python -m compileall -q src/spk_recovery/private_v309_packet_partial_methods_r169.py
