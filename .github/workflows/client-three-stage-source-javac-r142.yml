name: V309 combined source javac R142 smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_three_stage_javac_r142.py"
      - "tests/test_private_v309_three_stage_javac_r142.py"
      - ".github/workflows/client-three-stage-source-javac-r142.yml"
  workflow_dispatch:

concurrency:
  group: client-three-javac-r142-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install source recovery tooling
        run: python -m pip install -e .
      - name: Run strict three-stage real javac fixtures
        run: python -m unittest discover -s tests -p "test_private_v309_three_stage_javac_r142.py" -v
      - name: Verify Python syntax
        run: python -m compileall -q src/spk_recovery/private_v309_three_stage_javac_r142.py
