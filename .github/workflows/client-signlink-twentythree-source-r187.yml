name: V309 original Signlink 23 Java methods R187
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_signlink_twentythree_source_r187.py"
      - "tests/test_private_v309_signlink_twentythree_source_r187.py"
      - ".github/workflows/client-signlink-twentythree-source-r187.yml"
  workflow_dispatch:
jobs:
  selected-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_private_v309_signlink_twentythree_source_r187.py" -v
      - run: python -m unittest discover -s tests -p "test_private_v309_signlink_twentyone_source_r186.py" -v
      - run: python -m compileall -q src/spk_recovery/private_v309_signlink_twentythree_source_r187.py
