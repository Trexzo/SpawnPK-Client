name: v309-r450-generic-resource-callsites
on:
  push:
    branches:
      - research/v309-r450-signature-resource-callsites
  pull_request:
    paths:
      - tools/r450/**
      - tests/test_v309_r450_*.py
      - docs/V309_R450_GENERIC_RESOURCE_CALLSITES.md
      - .github/workflows/v309-r450-generic-resources.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-generic-signatures-resource-callsite-evidence:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: R450 fabricated Java11 generic Signature and adjacent loader callsite tests
        run: python -B -m unittest discover -s tests -p 'test_v309_r450_*.py' -v
      - name: Inherited R449 descriptor-only and string-literal analysis
        run: python -B -m unittest discover -s tests -p 'test_v309_r449_*.py' -v
      - name: Inherited R448 static class index graph
        run: python -B -m unittest discover -s tests -p 'test_v309_r448_*.py' -v
      - name: Inherited R447 original-JAR resource and class coverage
        run: python -B -m unittest discover -s tests -p 'test_v309_r447_*.py' -v
      - name: Inherited R446 owner-isolated SHA observation
        run: python -B -m unittest discover -s tests -p 'test_v309_r446_*.py' -v
      - name: Inherited R445 bounded read-only filesystem gates
        run: python -B -m unittest discover -s tests -p 'test_v309_r445_*.py' -v
      - name: Inherited R442 approved prior baseline mandatory
        run: python -B -m unittest discover -s tests -p 'test_v309_r442_*.py' -v
      - name: Inherited R426 fabricated Java Store compile acceptance
        run: python -B -m unittest discover -s tests -p 'test_v309_r426_full_mock_pipeline.py' -v
