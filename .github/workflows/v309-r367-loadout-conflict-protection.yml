name: v309 R367 loadout store optimistic conflict detection (synthetic only)
on:
  pull_request:
    paths:
      - 'scripts/verify_v309_r367_race_candidate.py'
      - 'tests/test_v309_r367_race_candidate.py'
      - 'research/v309-source-recovery/r367-loadout-conflict-protection-witness.json'
      - '.github/workflows/v309-r367-loadout-conflict-protection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r367-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Synthetic-only archive provenance tests (NO private game source)
        run: python -m unittest discover -s tests -p test_v309_r367_race_candidate.py -v
