name: R204 Java11 source classfile attestation
on:
  pull_request:
    paths:
      - 'tools/attest_closed_java11_classes_r204.py'
      - 'tests/test_attest_closed_java11_classes_r204.py'
      - '.github/workflows/r204-source-attestation.yml'
  workflow_dispatch:
jobs:
  attest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Synthetic full source-to-classfile attestation
        run: python -m unittest discover -s tests -p 'test_attest_closed_java11_classes_r204.py' -v
