name: v309 R389 canonical JAR ordering (PUBLIC synthetic only)
on:
  push:
    branches:
      - 'research/v309-r389-*'
  pull_request:
    paths:
      - 'tools/r383/verify_private_full_build.py'
      - 'tools/r386/run_self_contained_acceptance.py'
      - 'tests/test_v309_r389_canonical_jar_order.py'
      - '.github/workflows/v309-r389-canonical-jar-order.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Synthetic canonical-order regression
        run: python -m unittest discover -s tests -p test_v309_r389_canonical_jar_order.py -v
      - name: Syntax verify isolated runner and orchestrator
        run: python -m py_compile tools/r383/verify_private_full_build.py tools/r386/run_self_contained_acceptance.py
