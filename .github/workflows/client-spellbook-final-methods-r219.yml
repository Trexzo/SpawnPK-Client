name: V309 final readable spellbook methods R219
on:
  pull_request:
    paths:
      - 'src/spk_recovery/private_v309_readable_spellbook_final_methods_r219.py'
      - 'tests/test_private_v309_readable_spellbook_final_methods_r219.py'
      - '.github/workflows/client-spellbook-final-methods-r219.yml'
  workflow_dispatch:
jobs:
  complete-original-method-code:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_private_v309_readable_spellbook_final_methods_r219.py -v
      - run: python -m unittest discover -s tests -p test_private_v309_readable_lunar_spells_r218.py -v
      - run: python -m compileall -q src/spk_recovery/private_v309_readable_spellbook_final_methods_r219.py
