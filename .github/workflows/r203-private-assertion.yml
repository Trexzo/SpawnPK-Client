name: R203 private assertion-owner candidate
on:
  pull_request:
    paths:
      - 'tools/private_assertion_owner_r203.py'
      - 'tests/test_private_assertion_owner_r203.py'
      - '.github/workflows/r203-private-assertion.yml'
  workflow_dispatch:
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Verify private exact-source patch with synthetic linked Java 11 classes
        run: python -m unittest discover -s tests -p 'test_private_assertion_owner_r203.py' -v
