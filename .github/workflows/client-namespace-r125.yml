name: V309 Java namespace legalizer smoke

on:
  pull_request:
    paths:
      - "src/spk_recovery/private_client_namespace_legalizer_r125.py"
      - "tests/test_private_client_namespace_legalizer_r125.py"
      - ".github/workflows/client-namespace-r125.yml"
  workflow_dispatch:

concurrency:
  group: client-namespace-r125-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Namespace solver tests with synthetic JARs only
        run: python -m unittest discover -s tests -p "test_private_client_namespace_legalizer_r125.py" -v
      - name: Python compilation
        run: python -m compileall -q src/spk_recovery/private_client_namespace_legalizer_r125.py
