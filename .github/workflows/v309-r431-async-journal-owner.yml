name: v309-r431-journal-bound-async-owner
on:
  push:
    branches:
      - research/v309-r431-journal-bound-async-owner-test
  pull_request:
    paths:
      - tests/fixtures/r431/**
      - tests/test_v309_r431_*.py
      - .github/workflows/v309-r431-async-journal-owner.yml
      - docs/V309_R431_SYNTHETIC_ASYNC_OWNER_JOURNAL.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-synthetic-r415-r417-async-bridge:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: R431 public Java11 real Swing + R415 intent + R417 classifier + cross-JVM owner lease
        run: python -m unittest discover -s tests -p 'test_v309_r431_*.py' -v
