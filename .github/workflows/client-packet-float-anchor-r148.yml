name: V309 Packet float-call edge R148 smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_packet_float_call_anchor_r148.py"
      - "src/spk_recovery/java/PrivatePacketFloatCallAnchorR148.java"
      - "tests/test_private_v309_packet_float_call_anchor_r148.py"
      - ".github/workflows/client-packet-float-anchor-r148.yml"
  workflow_dispatch:

concurrency:
  group: client-packet-float-r148-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Python recovery package
        run: python -m pip install -e .
      - name: Test JVM 4-op float forwarding and Java AST callee mapping
        run: python -m unittest discover -s tests -p "test_private_v309_packet_float_call_anchor_r148.py" -v
      - name: Recheck unique source member seeds
        run: python -m unittest discover -s tests -p "test_private_v309_packet_member_seeds_r147.py" -v
      - name: R148 Python syntax check
        run: python -m compileall -q src/spk_recovery/private_v309_packet_float_call_anchor_r148.py
