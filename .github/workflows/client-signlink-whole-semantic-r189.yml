name: V309 Signlink whole-owner semantic source R189
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_signlink_whole_semantic_r189.py"
      - "tests/test_private_v309_signlink_whole_semantic_r189.py"
      - ".github/workflows/client-signlink-whole-semantic-r189.yml"
  workflow_dispatch:
jobs:
  semantic-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_private_v309_signlink_whole_semantic_r189.py" -v
      - run: python -m compileall -q src/spk_recovery/private_v309_signlink_whole_semantic_r189.py
