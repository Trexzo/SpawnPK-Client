name: V309 spellbook proof closure R220
on:
  pull_request:
    paths:
      - 'src/spk_recovery/private_v309_spellbook_whole_class_preflight_r220.py'
      - 'tests/test_private_v309_spellbook_whole_class_preflight_r220.py'
      - '.github/workflows/client-spellbook-proof-closure-r220.yml'
  workflow_dispatch:
jobs:
  closure:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_private_v309_spellbook_whole_class_preflight_r220.py -v
