name: V309 original quaternion full Java source R167
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_original_quaternion_source_r167.py"
      - "tests/test_private_v309_original_quaternion_r167.py"
      - ".github/workflows/client-original-quaternion-r167.yml"
  workflow_dispatch:
jobs:
  quaternion-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_private_v309_original_quaternion_r167.py" -v
      - run: python -m unittest discover -s tests -p "test_private_v309_original_transform_r166.py" -v
