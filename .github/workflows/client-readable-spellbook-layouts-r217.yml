name: V309 original spellbook lunar + ancient source R217
on:
  pull_request:
    paths:
      - 'src/spk_recovery/private_v309_readable_spellbook_layouts_r217.py'
      - 'tests/test_private_v309_readable_spellbook_layouts_r217.py'
      - '.github/workflows/client-readable-spellbook-layouts-r217.yml'
  workflow_dispatch:
jobs:
  two-original-layouts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_private_v309_readable_spellbook_layouts_r217.py -v
      - run: python -m unittest discover -s tests -p test_private_v309_readable_spellbook_filter_panel_r216.py -v
      - run: python -m compileall -q src/spk_recovery/private_v309_readable_spellbook_layouts_r217.py
