name: V309 private-gate smoke

on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_*.py"
      - "src/spk_recovery/private_one_final_original_owner_r118.py"
      - "tests/test_private_v309_*.py"
      - "tests/test_private_one_final_original_owner_r118.py"
      - ".github/workflows/v309-private-gate-smoke.yml"
  workflow_dispatch:

concurrency:
  group: v309-private-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  narrow:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install package
        run: python -m pip install -e .
      - name: R117 to R120 new gate unit tests
        run: |
          python -m unittest discover -s tests -p "test_private_v309_loader_symbolic_frames_r117.py" -v
          python -m unittest discover -s tests -p "test_private_one_final_original_owner_r118.py" -v
          python -m unittest discover -s tests -p "test_private_v309_three_stage_replay_r119.py" -v
          python -m unittest discover -s tests -p "test_private_v309_source_build_witness_r120.py" -v
