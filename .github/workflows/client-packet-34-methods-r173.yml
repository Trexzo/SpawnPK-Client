name: V309 original Packet 34 source methods R173
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_packet_34_methods_r173.py"
      - "tests/test_private_v309_packet_34_methods_r173.py"
      - ".github/workflows/client-packet-34-methods-r173.yml"
  workflow_dispatch:
jobs:
  source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_private_v309_packet_34_methods_r173.py" -v
      - run: python -m unittest discover -s tests -p "test_private_v309_packet_22_methods_r172.py" -v
