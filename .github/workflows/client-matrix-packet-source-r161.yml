name: V309 original Packet matrix source-only loader R161
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_matrix_packet_source_r161.py"
      - "tests/test_private_v309_matrix_packet_source_r161.py"
      - ".github/workflows/client-matrix-packet-source-r161.yml"
  workflow_dispatch:

jobs:
  source-only-packet:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install source reconstruction toolkit
        run: python -m pip install -e .
      - name: Verify original Packet constructor loader source-only JVM instructions
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_packet_source_r161.py" -v
      - name: Keep R160 exact float locals inverse and matrix product regressions
        run: python -m unittest discover -s tests -p "test_private_v309_float_locals_lifter_r160.py" -v
      - name: R161 Python syntax check
        run: python -m compileall -q src/spk_recovery/private_v309_matrix_packet_source_r161.py
