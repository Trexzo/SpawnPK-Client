name: V309 original matrix decomposition method closure R155
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_matrix_source_method_parity_r150.py"
      - "tests/test_private_v309_matrix_source_closure_r155.py"
      - ".github/workflows/client-matrix-decomposition-closure-r155.yml"
  workflow_dispatch:

jobs:
  matrix-decomposition:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install source recovery tooling
        run: python -m pip install -e .
      - name: Strict selected original-to-source internal invocation closure
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_source_closure_r155.py" -v
      - name: Preserve R154 Java string formatter source parity
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_string_source_parity_r154.py" -v
      - name: Preserve R150 six recovered methods
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_source_method_parity_r150.py" -v
      - name: Python syntax check
        run: python -m compileall -q src/spk_recovery/private_v309_matrix_source_method_parity_r150.py
