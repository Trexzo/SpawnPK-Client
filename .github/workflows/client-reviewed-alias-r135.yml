name: V309 reviewed source alias edit smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_reviewed_java_alias_edit_r135.py"
      - "src/spk_recovery/java/ReviewedImportAliasSpansR135.java"
      - "tests/test_private_reviewed_java_alias_edit_r135.py"
      - ".github/workflows/client-reviewed-alias-r135.yml"
  workflow_dispatch:

concurrency:
  group: client-alias-r135-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install package
        run: python -m pip install -e .
      - name: JVM-guarded AST source alias repair synthetic tests
        run: python -m unittest discover -s tests -p "test_private_reviewed_java_alias_edit_r135.py" -v
      - name: Compile Python
        run: python -m compileall -q src/spk_recovery/private_reviewed_java_alias_edit_r135.py
