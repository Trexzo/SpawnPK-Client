name: R8K temporary public source harness

on:
  pull_request:
  workflow_dispatch:

jobs:
  package-public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: r8k-public-source-harness
          path: |
            src
            tests
            pyproject.toml
          if-no-files-found: error
          retention-days: 1
