name: V309 original Packet signed16 raw32 float Java source R170
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_packet_three_methods_r170.py"
      - "tests/test_private_v309_packet_three_methods_r170.py"
      - ".github/workflows/client-packet-three-source-methods-r170.yml"
  workflow_dispatch:
jobs:
  packet-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - name: Verify Packet three original Java method JVM Code and bit-exact runtime
        run: python -m unittest discover -s tests -p "test_private_v309_packet_three_methods_r170.py" -v
      - name: R169 original short and float-wrapper parity regression
        run: python -m unittest discover -s tests -p "test_private_v309_packet_partial_methods_r169.py" -v
      - name: Java source recovery tool syntax
        run: python -m compileall -q src/spk_recovery/private_v309_packet_three_methods_r170.py
