name: Recovery CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: recovery-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: CLI import smoke
        run: python -m spk_recovery.cli --help
      - name: Repository hygiene
        run: python scripts/check_repo_hygiene.py
      - name: Private replay launcher syntax (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tokens = $null
          $Errors = $null
          $ScriptPath = Join-Path (Get-Location) 'scripts/Invoke-V309ExactPrivateFiveLaneReplay.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($ScriptPath, [ref]$Tokens, [ref]$Errors) | Out-Null
          if ($Errors.Count -ne 0) { throw "Private replay PowerShell parser found $($Errors.Count) errors" }
