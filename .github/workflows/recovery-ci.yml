name: Recovery CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: recovery-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: CLI import smoke
        run: python -m spk_recovery.cli --help
      - name: Repository hygiene
        run: python scripts/check_repo_hygiene.py
      # Temporary public-source-only handoff for off-network private-JAR replay.
      # Deliberately excludes all client archives, generated outputs and .git.
      - name: Export public v309 recovery source (Ubuntu only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: v309-public-offline-recovery-source
          retention-days: 1
          if-no-files-found: error
          path: |
            pyproject.toml
            src/spk_recovery/
            research/v309-field-recovery/
      - name: Private replay launcher syntax (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tokens = $null
          $Errors = $null
          $ScriptPath = Join-Path (Get-Location) 'scripts/Invoke-V309ExactPrivateFiveLaneReplay.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($ScriptPath, [ref]$Tokens, [ref]$Errors) | Out-Null
          if ($Errors.Count -ne 0) { throw "Private replay PowerShell parser found $($Errors.Count) errors" }
      - name: Private replay fails closed without original JARs (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ScriptPath = Join-Path (Get-Location) 'scripts/Invoke-V309ExactPrivateFiveLaneReplay.ps1'
          $OutputRoot = Join-Path $env:RUNNER_TEMP 'spk-v309-private-negative-smoke'
          $OldJar = Join-Path $env:RUNNER_TEMP 'deliberately-absent-old.jar'
          $NewJar = Join-Path $env:RUNNER_TEMP 'deliberately-absent-new.jar'
          if ((Test-Path $OldJar) -or (Test-Path $NewJar) -or (Test-Path $OutputRoot)) {
            throw 'Negative smoke preimage not clean'
          }
          $Refused = $false
          try {
            & $ScriptPath -V308Jar $OldJar -V309Jar $NewJar -ReportDir $OutputRoot
          }
          catch {
            if ($_.Exception.Message -notlike '*does not exist*') { throw }
            $Refused = $true
          }
          if (-not $Refused -or (Test-Path $OutputRoot)) {
            throw 'Private replay launcher did not fail closed before output'
          }
