name: Recovery CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: CLI import smoke
        run: python -m spk_recovery.cli --help
      - name: Repository hygiene
        run: python scripts/check_repo_hygiene.py


      - name: Build temporary public R8G acceptance source snapshot
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-source
          git archive --format=zip -o acceptance-source/r8g-source.zip HEAD
      - name: Upload temporary public R8G acceptance source snapshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: r8g-public-source-snapshot
          path: acceptance-source/r8g-source.zip
          retention-days: 1
