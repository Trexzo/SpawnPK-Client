name: Source M1 Authority

on:
  workflow_dispatch:
    inputs:
      workspace_run_id:
        description: GitHub Actions run containing the recovered Source M1 workspace artifact
        required: true
        type: string
      workspace_artifact_name:
        description: Recovered Source M1 workspace artifact name
        required: true
        default: spawnpk-v308-recovered-workspace
        type: string
      authority_artifact_name:
        description: Output Source M1 authority artifact name
        required: true
        default: spawnpk-v308-source-authority
        type: string
      authority_commit:
        description: Exact SpawnPK-Client authority commit (lowercase 40 hex)
        required: true
        type: string
  workflow_call:
    inputs:
      workspace_run_id:
        description: Optional prior run ID; blank consumes the caller run artifact
        required: false
        default: ""
        type: string
      workspace_artifact_name:
        description: Recovered Source M1 workspace artifact name
        required: false
        default: spawnpk-v308-recovered-workspace
        type: string
      authority_artifact_name:
        description: Output Source M1 authority artifact name
        required: false
        default: spawnpk-v308-source-authority
        type: string
      authority_commit:
        description: Exact SpawnPK-Client authority commit (lowercase 40 hex)
        required: true
        type: string
    outputs:
      artifact_id:
        description: Verified Source M1 authority artifact ID
        value: ${{ jobs.produce-source-authority.outputs.artifact_id }}
      verification_id:
        description: Independent Source M1 authority verification ID
        value: ${{ jobs.produce-source-authority.outputs.verification_id }}
      source_tree_sha256:
        description: Canonical Java source-tree SHA-256
        value: ${{ jobs.produce-source-authority.outputs.source_tree_sha256 }}
      authority_artifact_name:
        description: Uploaded Source M1 authority artifact name
        value: ${{ jobs.produce-source-authority.outputs.authority_artifact_name }}

permissions:
  contents: read
  actions: read

jobs:
  produce-source-authority:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.result.outputs.artifact_id }}
      verification_id: ${{ steps.result.outputs.verification_id }}
      source_tree_sha256: ${{ steps.result.outputs.source_tree_sha256 }}
      authority_artifact_name: ${{ steps.result.outputs.authority_artifact_name }}
    steps:
      - name: Checkout recovery tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install recovery tooling
        run: python -m pip install -e .

      - name: Validate exact authority commit
        shell: bash
        env:
          AUTHORITY_COMMIT: ${{ inputs.authority_commit }}
        run: |
          set -euo pipefail
          if ! [[ "$AUTHORITY_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "authority_commit must be exact lowercase 40-hex" >&2
            exit 2
          fi
          git cat-file -e "$AUTHORITY_COMMIT^{commit}"
          git merge-base --is-ancestor "$AUTHORITY_COMMIT" HEAD

      - name: Validate prior recovered workspace run provenance
        if: ${{ inputs.workspace_run_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL_VALUE: ${{ github.api_url }}
          GITHUB_REPOSITORY_VALUE: ${{ github.repository }}
          WORKSPACE_RUN_ID: ${{ inputs.workspace_run_id }}
          AUTHORITY_COMMIT: ${{ inputs.authority_commit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          run_id = os.environ["WORKSPACE_RUN_ID"]
          repository = os.environ["GITHUB_REPOSITORY_VALUE"]
          api_url = os.environ["GITHUB_API_URL_VALUE"].rstrip("/")
          token = os.environ["GH_TOKEN"]
          authority_commit = os.environ["AUTHORITY_COMMIT"]

          if not re.fullmatch(r"[1-9][0-9]*", run_id):
              raise SystemExit(
                  "workspace_run_id must be a positive decimal run ID"
              )

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(
                  request,
                  timeout=30,
              ) as response:
                  return json.load(response)

          run = get_json(
              f"{api_url}/repos/{repository}/actions/runs/{run_id}"
          )
          run_repository = (
              (run.get("repository") or {}).get("full_name")
          )
          if run_repository != repository:
              raise SystemExit(
                  "workspace run repository mismatch: "
                  f"{run_repository!r}"
              )
          if (
              run.get("status") != "completed"
              or run.get("conclusion") != "success"
          ):
              raise SystemExit(
                  "workspace run must be completed successfully"
              )

          head_sha = run.get("head_sha")
          if not isinstance(head_sha, str) or not re.fullmatch(
              r"[0-9a-f]{40}",
              head_sha,
          ):
              raise SystemExit(
                  "workspace run head SHA is not lowercase 40-hex"
              )

          comparison = get_json(
              f"{api_url}/repos/{repository}/compare/"
              f"{authority_commit}...{head_sha}"
          )
          if comparison.get("status") not in {"ahead", "identical"}:
              raise SystemExit(
                  "authority commit is not an ancestor of "
                  "the workspace run head"
              )

          print(
              "validated prior workspace run "
              f"{run_id} at head {head_sha}"
          )
          PY

      - name: Download recovered workspace artifact from caller run
        if: ${{ inputs.workspace_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.workspace_artifact_name }}
          path: workspace

      - name: Download recovered workspace artifact from prior run
        if: ${{ inputs.workspace_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.workspace_artifact_name }}
          path: workspace
          github-token: ${{ github.token }}
          run-id: ${{ inputs.workspace_run_id }}

      - name: Validate recovered workspace contract
        shell: bash
        run: |
          set -euo pipefail
          test -f workspace/class-lineage.json
          test -f workspace/member-lineage.json
          test -f workspace/readable-client-manifest.json
          test -f workspace/recovered-source-manifest.json
          test -f workspace/clean-rebuild.json
          test -f workspace/recovery-release.json
          test -f workspace/release-verification.json
          test -d workspace/src

          python - <<'PY'
          from pathlib import Path

          root = Path("workspace")
          required = {
              "class-lineage.json",
              "member-lineage.json",
              "readable-client-manifest.json",
              "recovered-source-manifest.json",
              "clean-rebuild.json",
              "recovery-release.json",
              "release-verification.json",
          }

          seen_required = set()
          java_count = 0
          forbidden = []

          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              rel = path.relative_to(root).as_posix()
              if rel in required:
                  seen_required.add(rel)
                  continue
              if rel.startswith("src/") and rel.endswith(".java"):
                  java_count += 1
                  continue
              forbidden.append(rel)

          missing = sorted(required - seen_required)
          if missing:
              raise SystemExit(
                  "recovered workspace missing required files: "
                  + ", ".join(missing)
              )
          if java_count == 0:
              raise SystemExit(
                  "recovered workspace contains no Java source files"
              )
          if forbidden:
              raise SystemExit(
                  "recovered workspace contains forbidden files: "
                  + ", ".join(forbidden)
              )
          PY

      - name: Build Source M1 authority artifact
        shell: bash
        env:
          AUTHORITY_COMMIT: ${{ inputs.authority_commit }}
        run: |
          set -euo pipefail
          python -m spk_recovery.source_authority_artifact_cli build             --authority-commit "$AUTHORITY_COMMIT"             --class-lineage workspace/class-lineage.json             --member-lineage workspace/member-lineage.json             --readable-manifest workspace/readable-client-manifest.json             --recovered-manifest workspace/recovered-source-manifest.json             --clean-rebuild workspace/clean-rebuild.json             --release-manifest workspace/recovery-release.json             --release-verification workspace/release-verification.json             --source-root workspace/src             --out-dir authority

      - name: Independently verify Source M1 authority artifact
        shell: bash
        env:
          AUTHORITY_COMMIT: ${{ inputs.authority_commit }}
        run: |
          set -euo pipefail
          mkdir -p verification
          python -m spk_recovery.source_authority_artifact_cli verify             --artifact-dir authority             --expected-authority-commit "$AUTHORITY_COMMIT"             --out verification/SOURCE-AUTHORITY-VERIFICATION.json

      - name: Export verified authority outputs
        id: result
        shell: bash
        env:
          AUTHORITY_ARTIFACT_NAME: ${{ inputs.authority_artifact_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path(
                  "authority/SOURCE-AUTHORITY-ARTIFACT.json"
              ).read_text(encoding="utf-8")
          )
          verification = json.loads(
              Path(
                  "verification/"
                  "SOURCE-AUTHORITY-VERIFICATION.json"
              ).read_text(encoding="utf-8")
          )

          if manifest.get("preflight_publishable") is not True:
              raise SystemExit(
                  "authority artifact preflight is not publishable"
              )
          if verification.get("verified") is not True:
              raise SystemExit(
                  "authority artifact verification is not true"
              )
          if (
              verification.get("artifact_id")
              != manifest.get("artifact_id")
          ):
              raise SystemExit(
                  "authority artifact ID does not match verification"
              )
          if (
              verification.get("source_tree_sha256")
              != manifest.get("source_tree_sha256")
          ):
              raise SystemExit(
                  "authority source-tree SHA does not match verification"
              )

          values = {
              "artifact_id": manifest["artifact_id"],
              "verification_id": verification["verification_id"],
              "source_tree_sha256": manifest["source_tree_sha256"],
              "authority_artifact_name": (
                  os.environ["AUTHORITY_ARTIFACT_NAME"]
              ),
          }
          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
              newline="\n",
          ) as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
          PY

      - name: Upload verified Source M1 authority artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.authority_artifact_name }}
          path: authority
          if-no-files-found: error
          retention-days: 30
