name: V309 original source dependency provenance smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_source_dependency_frontier_r134.py"
      - "tests/test_private_v309_source_dependency_frontier_r134.py"
      - ".github/workflows/client-dependency-frontier-r134.yml"
  workflow_dispatch:

concurrency:
  group: client-dependency-r134-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Dependency provenance and nonoriginal-input boundary fixtures
        run: python -m unittest discover -s tests -p "test_private_v309_source_dependency_frontier_r134.py" -v
      - name: Compile Python
        run: python -m compileall -q src/spk_recovery/private_v309_source_dependency_frontier_r134.py
