name: v309 source-only Windows acceptance safety

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/windows/**'
      - 'tests/python/r287/**'
      - 'tests/python/r289/**'
      - 'tests/python/r290/**'
      - 'tests/python/r291/**'
      - 'tests/python/r292/**'
      - 'tests/python/r293/**'
      - 'tests/python/r294/**'
      - 'tests/python/r295/**'
      - 'tests/python/r296/**'
      - 'tests/python/r297/**'
      - 'tests/powershell/r297/**'
      - 'tools/gui/r296/**'
      - 'tests/java/r295/**'
      - 'tools/recovery/r295/**'
      - 'tools/gui/r294/**'
      - 'tests/java/r293/**'
      - 'tools/recovery/r293/**'
      - 'tests/powershell/r292/**'
      - 'tests/powershell/r291/**'
      - 'tests/java/r290/**'
      - 'tools/recovery/r290/**'
      - 'tests/powershell/r289/**'
      - '.github/workflows/v309-r289-windows-safety.yml'
  push:
    branches:
      - integration/v309-r265-local-player-mask-diagnostic
    paths:
      - 'tools/windows/**'
      - 'tests/python/r287/**'
      - 'tests/python/r289/**'
      - 'tests/python/r290/**'
      - 'tests/python/r291/**'
      - 'tests/python/r292/**'
      - 'tests/python/r293/**'
      - 'tests/python/r294/**'
      - 'tests/python/r295/**'
      - 'tests/python/r296/**'
      - 'tests/python/r297/**'
      - 'tests/powershell/r297/**'
      - 'tools/gui/r296/**'
      - 'tests/java/r295/**'
      - 'tools/recovery/r295/**'
      - 'tools/gui/r294/**'
      - 'tests/java/r293/**'
      - 'tools/recovery/r293/**'
      - 'tests/powershell/r292/**'
      - 'tests/powershell/r291/**'
      - 'tests/java/r290/**'
      - 'tools/recovery/r290/**'
      - 'tests/powershell/r289/**'
      - '.github/workflows/v309-r289-windows-safety.yml'

permissions:
  contents: read

jobs:
  isolated-source-gates:
    name: Source-only gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 10
    steps:
      - name: Preserve source line endings for SHA pins
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify R287 negative-path suite
        run: python tests/python/r287/R287ReadinessRegression.py
      - name: Verify R289 contract and original SHA pins
        run: python tests/python/r289/R289GateContractRegression.py
      - name: Verify R290 source-build safety and preimage refusal
        run: python tests/python/r290/R290SourceSafetyRegression.py
      - name: Verify R291 R290-aware guarded overlay and fake-archive refusal
        run: python tests/python/r291/R291SafetyRegression.py
      - name: Verify R292 truthful readiness and SHA-locked source refusal
        run: python tests/python/r292/R292AdmissionRegression.py
      - name: Verify R293 pinned real-client source-fix contract
        run: python tests/python/r293/R293SourceSafetyRegression.py
      - name: Verify R294 pinned R293 graphical replay source safety (no private inputs)
        run: python tests/python/r294/R294SourceSafetyRegression.py
      - name: Verify R295 client Scene bound patch provenance and private file exclusion
        run: python tests/python/r295/R295SourceSafetyRegression.py
      - name: Verify R296 original wait/full wrapper source safety
        run: python tests/python/r296/R296SourceSafetyRegression.py
      - name: Verify R297 exact R295 native GUI source and truthful Win32 readiness
        run: python tests/python/r297/R297AcceptanceRegression.py
      - name: Exercise genuine Windows PowerShell failure paths (no game)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/powershell/r289/Invoke-R289-SafeWindowsChecks.ps1
      - name: Verify real Win32 R291 bootstrap fail-closed contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/powershell/r291/Invoke-R291-NativeSourceSafety.ps1
      - name: Verify native Win32 R292 SHA/GUI-opt-in fail-closed behavior
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/powershell/r292/Invoke-R292-NativeSourceSafety.ps1
      - name: Verify real Win32 R297 native launcher failure paths (no game)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/powershell/r297/Invoke-R297-NativeSourceSafety.ps1

