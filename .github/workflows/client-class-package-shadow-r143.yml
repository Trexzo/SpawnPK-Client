name: V309 class package shadow R143 source javac smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_casefold_type_rewrite_r141.py"
      - "tests/test_private_v309_shadowed_class_rewrite_r143.py"
      - ".github/workflows/client-class-package-shadow-r143.yml"
  workflow_dispatch:

concurrency:
  group: client-shadow-r143-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install recovery source package
        run: python -m pip install -e .
      - name: Compile synthetic original JVM class package shadow and recompile edited Java
        run: python -m unittest discover -s tests -p "test_private_v309_shadowed_class_rewrite_r143.py" -v
      - name: Recheck R141 class-casefold regression fixture
        run: python -m unittest discover -s tests -p "test_private_v309_casefold_type_rewrite_r141.py" -v
      - name: Recheck R142 package and type staged javac
        run: python -m unittest discover -s tests -p "test_private_v309_three_stage_javac_r142.py" -v
