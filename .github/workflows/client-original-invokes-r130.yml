name: V309 original JVM invoke-edge smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_original_jvm_invoke_edges_r130.py"
      - "tests/test_private_original_jvm_invoke_edges_r130.py"
      - ".github/workflows/client-original-invokes-r130.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install package
        run: python -m pip install -e .
      - name: Synthetic Java9 direct JVM invocation proof
        run: python -m unittest discover -s tests -p "test_private_original_jvm_invoke_edges_r130.py" -v
      - name: Python syntax compile
        run: python -m compileall -q src/spk_recovery/private_original_jvm_invoke_edges_r130.py
