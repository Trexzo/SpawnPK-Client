name: v309 R364 semantic loadout actions (synthetic only)
on:
  pull_request:
    paths:
      - 'scripts/prepare_v309_r364_readable_loadout_actions.py'
      - 'tests/test_v309_r364_readable_loadout_actions.py'
      - 'research/v309-source-recovery/r364-loadout-actions-witness.json'
      - '.github/workflows/v309-r364-semantic-loadout-actions.yml'
  workflow_dispatch:
jobs:
  synthetic-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Synthetic source-only tests, no private inputs
        shell: bash
        run: python -m unittest discover -s tests -p 'test_v309_r364_readable_loadout_actions.py' -v
