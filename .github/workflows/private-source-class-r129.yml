name: V309 private source-first Java9 class replay smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_java9_source_class_matrix_r129.py"
      - "tests/test_private_v309_java9_source_class_matrix_r129.py"
      - ".github/workflows/private-source-class-r129.yml"
  workflow_dispatch:

concurrency:
  group: private-source-class-r129-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install package
        run: python -m pip install -e .
      - name: Source-only Java9 compiler and exact method-matrix tests
        run: python -m unittest discover -s tests -p "test_private_v309_java9_source_class_matrix_r129.py" -v
      - name: Python syntax
        run: python -m compileall -q src/spk_recovery/private_v309_java9_source_class_matrix_r129.py
