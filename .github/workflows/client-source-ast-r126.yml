name: V309 private AST census smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_client_source_ast_census_r126.py"
      - "src/spk_recovery/java/ClientAstDeclarationCensusR126.java"
      - "tests/test_private_client_source_ast_census_r126.py"
      - ".github/workflows/client-source-ast-r126.yml"
  workflow_dispatch:

concurrency:
  group: client-source-ast-r126-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install package
        run: python -m pip install -e .
      - name: AST-only original-source identity fixtures
        run: python -m unittest discover -s tests -p "test_private_client_source_ast_census_r126.py" -v
      - name: Python compilation
        run: python -m compileall -q src/spk_recovery/private_client_source_ast_census_r126.py
