name: Client-only v308-v309 asset delta smoke

on:
  pull_request:
    paths:
      - "src/spk_recovery/private_client_asset_build_delta_r124.py"
      - "tests/test_private_client_asset_build_delta_r124.py"
      - ".github/workflows/client-asset-class-delta-r124.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local recovery tooling
        run: python -m pip install -e .
      - name: Synthetic client ZIP, class reuse, PII exclusion tests
        run: python -m unittest discover -s tests -p "test_private_client_asset_build_delta_r124.py" -v
