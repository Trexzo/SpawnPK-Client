name: V309 Packet helper original ABI worklist R181
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_packet_helper_frontier_r181.py"
      - "tests/test_private_v309_packet_helper_frontier_r181.py"
      - ".github/workflows/client-packet-helper-frontier-r181.yml"
  workflow_dispatch:
jobs:
  synthetic-helper-frontier:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_private_v309_packet_helper_frontier_r181.py" -v
      - run: python -m compileall -q src/spk_recovery/private_v309_packet_helper_frontier_r181.py
