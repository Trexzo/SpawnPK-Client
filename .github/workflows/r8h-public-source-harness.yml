name: R8H Public Source Harness

on:
  push:
    branches:
      - core/r8h-keyword-member-source-safety-clean

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: r8h-public-source
          path: |
            .
            !.git/**
          if-no-files-found: error
          retention-days: 1
