name: V309 atomic multi-import R144 source javac smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_casefold_type_rewrite_r141.py"
      - "tests/test_private_v309_atomic_multi_import_r144.py"
      - ".github/workflows/client-multi-import-type-r144.yml"
  workflow_dispatch:

concurrency:
  group: client-multi-import-r144-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install recovery tooling
        run: python -m pip install -e .
      - name: Verify all-or-nothing dual-alias Java AST transformations and javac
        run: python -m unittest discover -s tests -p "test_private_v309_atomic_multi_import_r144.py" -v
      - name: Regression R141 casefold source repair
        run: python -m unittest discover -s tests -p "test_private_v309_casefold_type_rewrite_r141.py" -v
      - name: Regression R143 class package shadow source repair
        run: python -m unittest discover -s tests -p "test_private_v309_shadowed_class_rewrite_r143.py" -v
      - name: Regression R142 three-stage source compiler
        run: python -m unittest discover -s tests -p "test_private_v309_three_stage_javac_r142.py" -v
