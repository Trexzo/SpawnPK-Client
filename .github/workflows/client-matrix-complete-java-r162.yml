name: V309 matrix complete Java R162
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_complete_matrix_java_r162.py"
      - "tests/test_private_v309_complete_matrix_java_r162.py"
      - ".github/workflows/client-matrix-complete-java-r162.yml"
  workflow_dispatch:
jobs:
  matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_private_v309_complete_matrix_java_r162.py" -v
      - run: python -m unittest discover -s tests -p "test_private_v309_matrix_packet_source_r161.py" -v
      - run: python -m unittest discover -s tests -p "test_private_v309_float_locals_lifter_r160.py" -v
