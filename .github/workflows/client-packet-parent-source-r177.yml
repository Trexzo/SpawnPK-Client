name: Packet parent source R177
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_packet_parent_source_r177.py"
      - "tests/test_private_v309_packet_parent_source_r177.py"
      - ".github/workflows/client-packet-parent-source-r177.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_private_v309_packet_parent_source_r177.py" -v
      - run: python -m unittest discover -s tests -p "test_private_v309_packet_61_methods_r176.py" -v
