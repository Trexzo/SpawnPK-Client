name: v309-r417-restart-ack-synthetic
on:
  push:
    branches:
      - research/v309-r417-restart-ack-crash-model
  pull_request:
    paths:
      - tools/r417/restart_ack_model.py
      - tests/test_v309_r417_restart_ack.py
      - .github/workflows/v309-r417-restart-ack.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-crash-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Synthetic R417 interrupted ack, fresh process and malformed evidence tests
        run: python -m unittest discover -s tests -p test_v309_r417_restart_ack.py -v
