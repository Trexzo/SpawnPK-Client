name: V309 Packet unique JVM member seeds R147 smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_packet_member_seeds_r147.py"
      - "src/spk_recovery/java/PrivatePacketNamedSourceR147.java"
      - "tests/test_private_v309_packet_member_seeds_r147.py"
      - ".github/workflows/client-packet-member-seeds-r147.yml"
  workflow_dispatch:

concurrency:
  group: client-packet-member-seeds-r147-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install recovery tooling
        run: python -m pip install -e .
      - name: Test strictly unique member shape candidates and ambiguous mapping vetoes
        run: python -m unittest discover -s tests -p "test_private_v309_packet_member_seeds_r147.py" -v
      - name: Regression R146 original owner structural gate
        run: python -m unittest discover -s tests -p "test_private_v309_packet_original_source_shape_r146.py" -v
      - name: Check script syntax
        run: python -m compileall -q src/spk_recovery/private_v309_packet_member_seeds_r147.py
