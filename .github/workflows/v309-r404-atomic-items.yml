name: v309 R404 atomic item history snapshots (public synthetic only)
on:
  push:
    branches:
      - 'research/v309-r404-*'
  pull_request:
    paths:
      - 'tools/r404/**'
      - 'tests/test_v309_r404_atomic_item_gate.py'
      - 'tests/fixtures/r404/**'
      - 'docs/V309_R404_ATOMIC_ITEM_SNAPSHOT.md'
      - '.github/workflows/v309-r404-atomic-items.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / JDK21
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: R404 public synthetic SHA-pinned source and class scope contract
        run: python -m unittest discover -s tests -p 'test_v309_r404_atomic_item_gate.py' -v
      - name: R404 standalone Java item DTO and concurrent mutation interleaving model
        run: |
          python -c "from pathlib import Path; Path('build/r404-synthetic').mkdir(parents=True, exist_ok=True)"
          javac --release 11 -d build/r404-synthetic tests/fixtures/r404/R404AtomicItemSnapshotSynthetic.java
          java -cp build/r404-synthetic R404AtomicItemSnapshotSynthetic
