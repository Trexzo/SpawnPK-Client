name: V309 long spellbook filter source Code R214
on:
  pull_request:
    paths:
      - 'src/spk_recovery/private_v309_readable_spellbook_long_filter_r214.py'
      - 'tests/test_private_v309_readable_spellbook_long_filter_r214.py'
      - '.github/workflows/client-readable-spellbook-filter-r214.yml'
  workflow_dispatch:
jobs:
  filter-method-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_private_v309_readable_spellbook_long_filter_r214.py -v
      - run: python -m unittest discover -s tests -p test_private_v309_readable_spellbook_toggle_methods_r213.py -v
      - run: python -m compileall -q src/spk_recovery/private_v309_readable_spellbook_long_filter_r214.py
