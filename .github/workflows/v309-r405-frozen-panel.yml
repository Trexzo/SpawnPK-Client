name: v309 R405 frozen panel batch snapshots (public synthetic only)
on:
  push:
    branches:
      - 'research/v309-r405-*'
  pull_request:
    paths:
      - 'tools/r405/**'
      - 'tests/test_v309_r405_frozen_panel_gate.py'
      - 'tests/fixtures/r405/**'
      - 'docs/V309_R405_FROZEN_PANEL_BATCH_SNAPSHOT.md'
      - '.github/workflows/v309-r405-frozen-panel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / JDK21
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: R405 read-only source and class-scope synthetic rejection controls
        run: python -m unittest discover -s tests -p 'test_v309_r405_frozen_panel_gate.py' -v
      - name: R405 Java frozen panel and pending handoff concurrency model
        run: |
          python -c "from pathlib import Path; Path('build/r405-synthetic').mkdir(parents=True, exist_ok=True)"
          javac --release 11 -d build/r405-synthetic tests/fixtures/r405/R405FrozenPanelSynthetic.java
          java -cp build/r405-synthetic R405FrozenPanelSynthetic
