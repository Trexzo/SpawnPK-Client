name: Private source ZIP intake smoke

on:
  pull_request:
    paths:
      - "src/spk_recovery/private_source_archive_delta_r123.py"
      - "tests/test_private_source_archive_delta_r123.py"
      - ".github/workflows/private-source-zip-intake.yml"
  workflow_dispatch:

jobs:
  zip-intake:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Private intake unit tests (no supplied archive or binaries)
        run: python -m unittest discover -s tests -p "test_private_source_archive_delta_r123.py" -v
