name: V309 original platform enum Java R191
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_platform_enum_r191.py"
      - "tests/test_private_v309_platform_enum_r191.py"
      - ".github/workflows/client-platform-enum-source-r191.yml"
  workflow_dispatch:
jobs:
  platform-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_private_v309_platform_enum_r191.py" -v
      - run: python -m unittest discover -s tests -p "test_private_v309_signlink_nested_enum_r190.py" -v
      - run: python -m compileall -q src/spk_recovery/private_v309_platform_enum_r191.py
