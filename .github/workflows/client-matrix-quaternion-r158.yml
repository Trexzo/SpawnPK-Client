name: V309 original matrix quaternion six-method source R158
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_matrix_six_method_bundle_r158.py"
      - "tests/test_private_v309_matrix_six_method_bundle_r158.py"
      - ".github/workflows/client-matrix-quaternion-r158.yml"
  workflow_dispatch:

jobs:
  matrix-quaternion:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install source recovery tooling
        run: python -m pip install -e .
      - name: Test six-method source bundle and negative quaternion controls
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_six_method_bundle_r158.py" -v
      - name: Preserve R157 vector transform source tests
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_vector_transform_parity_r157.py" -v
      - name: Preserve R155 strict selected source closure
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_source_closure_r155.py" -v
