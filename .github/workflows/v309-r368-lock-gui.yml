name: v309 R368 cooperative lock and GUI feedback (synthetic only)
on:
  pull_request:
    paths:
      - 'scripts/verify_v309_r368_lock_gui_candidate.py'
      - 'tests/test_v309_r368_lock_gui_candidate.py'
      - 'research/v309-source-recovery/r368-lock-gui-witness.json'
      - '.github/workflows/v309-r368-lock-gui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r368-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Synthetic archive verifier tests (no private client source)
        run: python -m unittest discover -s tests -p test_v309_r368_lock_gui_candidate.py -v
