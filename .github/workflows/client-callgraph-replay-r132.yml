name: V309 private callgraph evidence replay smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_callgraph_evidence_replay_r132.py"
      - "tests/test_private_callgraph_evidence_replay_r132.py"
      - ".github/workflows/client-callgraph-replay-r132.yml"
  workflow_dispatch:

concurrency:
  group: client-callgraph-replay-r132-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Independent private manifest and no-false-acceptance regression
        run: python -m unittest discover -s tests -p "test_private_callgraph_evidence_replay_r132.py" -v
      - name: Python syntax
        run: python -m compileall -q src/spk_recovery/private_callgraph_evidence_replay_r132.py
