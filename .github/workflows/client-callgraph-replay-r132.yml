name: V309 three-evidence callgraph replay smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_three_evidence_callgraph_replay_r132.py"
      - "tests/test_private_three_evidence_callgraph_replay_r132.py"
      - ".github/workflows/client-callgraph-replay-r132.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: R132 three independent digest/report integration fixtures
        run: python -m unittest discover -s tests -p "test_private_three_evidence_callgraph_replay_r132.py" -v
      - name: Compile Python
        run: python -m compileall -q src/spk_recovery/private_three_evidence_callgraph_replay_r132.py
