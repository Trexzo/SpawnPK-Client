name: v309 R399 session-scoped loot callback gate (synthetic public only)
on:
  push:
    branches:
      - 'research/v309-r399-*'
  pull_request:
    paths:
      - 'tools/r399/**'
      - 'tests/test_v309_r399_session_callbacks_gate.py'
      - 'tests/fixtures/r399/**'
      - 'docs/V309_R399_SESSION_CALLBACK_GUARDS.md'
      - '.github/workflows/v309-r399-session-callbacks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / JDK21
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: R399 public synthetic session epoch, identity and source/class gate
        run: python -m unittest discover -s tests -p 'test_v309_r399_session_callbacks_gate.py' -v
      - name: R399 standalone Java callback restart/ack/admission race model
        run: |
          python -c "from pathlib import Path; Path('build/r399-synthetic').mkdir(parents=True, exist_ok=True)"
          javac --release 11 -d build/r399-synthetic tests/fixtures/r399/R399SessionCallbacksSynthetic.java
          java -cp build/r399-synthetic R399SessionCallbacksSynthetic
