name: v309 R374 atomic rename receipt staging (synthetic only)
on:
  pull_request:
    paths:
      - '.github/workflows/v309-r374-receipt-staging.yml'
      - 'scripts/verify_v309_r374_receipt_staging.py'
      - 'tests/test_v309_r374_receipt_staging.py'
      - 'research/v309-source-recovery/r374-receipt-staging-witness.json'
      - 'docs/V309_R374_ATOMIC_RENAME_INTENT_STAGING.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-receipt-checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify synthetic R374 source-archive contracts only
        run: python -m unittest discover -s tests -p 'test_v309_r374_receipt_staging.py' -v
