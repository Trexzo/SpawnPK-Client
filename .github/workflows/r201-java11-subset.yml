name: R201 standalone Java11 subset
on:
  pull_request:
    paths:
      - 'tools/closed_java11_subset_r201.py'
      - 'tests/test_closed_java11_subset_r201.py'
      - '.github/workflows/r201-java11-subset.yml'
  workflow_dispatch:
jobs:
  subset:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Compile synthetic closed Java11 subset
        run: python -m unittest discover -s tests -p 'test_closed_java11_subset_r201.py' -v
