name: v309-r458-invokedynamic-bootstrap
on:
  push:
    branches:
      - research/v309-r458-invokedynamic-bootstrap
  pull_request:
    paths:
      - tools/r458/**
      - tests/test_v309_r458_*.py
      - docs/V309_R458_INVOKEDYNAMIC_BOOTSTRAP.md
      - .github/workflows/v309-r458-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invented-java11-dynamic-callsite-handles:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: R458 invented invokedynamic BootstrapMethods MethodHandle and condy
        run: python -B -m unittest discover -s tests -p 'test_v309_r458_*.py' -v
      - name: Inherited R457 JVM descriptor slots and callsite constructor rules
        run: python -B -m unittest discover -s tests -p 'test_v309_r457_*.py' -v
      - name: Inherited R456 exact JVM field and method instructions
        run: python -B -m unittest discover -s tests -p 'test_v309_r456_*.py' -v
      - name: Inherited R455 preferred dependency member metadata and ZIP guard
        run: python -B -m unittest discover -s tests -p 'test_v309_r455_*.py' -v
      - name: Inherited R454 reconstructed inheritance ancestry
        run: python -B -m unittest discover -s tests -p 'test_v309_r454_*.py' -v
      - name: Inherited R453 JVM constant pool member-reference signatures
        run: python -B -m unittest discover -s tests -p 'test_v309_r453_*.py' -v
      - name: Inherited R452 conservative forward-branch resource arguments
        run: python -B -m unittest discover -s tests -p 'test_v309_r452_*.py' -v
      - name: Inherited R451 straight-line resource argument dataflow
        run: python -B -m unittest discover -s tests -p 'test_v309_r451_*.py' -v
      - name: Inherited R450 Java11 Code and Signature parsing
        run: python -B -m unittest discover -s tests -p 'test_v309_r450_*.py' -v
      - name: Inherited R449 static descriptor and resource candidates
        run: python -B -m unittest discover -s tests -p 'test_v309_r449_*.py' -v
      - name: Inherited R448 reconstructed class reference inventory
        run: python -B -m unittest discover -s tests -p 'test_v309_r448_*.py' -v
      - name: Inherited R447 pinned original v309 JAR and ZIP safety
        run: python -B -m unittest discover -s tests -p 'test_v309_r447_*.py' -v
      - name: Inherited R446 owner TEMP complete source and class SHA guards
        run: python -B -m unittest discover -s tests -p 'test_v309_r446_*.py' -v
      - name: Inherited R445 safe bounded owner TEMP reads
        run: python -B -m unittest discover -s tests -p 'test_v309_r445_*.py' -v
      - name: Inherited R442 historical R421 full inventory independent admission
        run: python -B -m unittest discover -s tests -p 'test_v309_r442_*.py' -v
      - name: Inherited R426 fake Java11 Store compilation gate
        run: python -B -m unittest discover -s tests -p 'test_v309_r426_full_mock_pipeline.py' -v
