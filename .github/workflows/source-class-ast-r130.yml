name: V309 semantic source class rewrite smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/java/ClientSingleClassRenameR130.java"
      - "src/spk_recovery/private_single_class_ast_rename_r130.py"
      - "tests/test_private_single_class_ast_rename_r130.py"
      - ".github/workflows/source-class-ast-r130.yml"
  workflow_dispatch:

concurrency:
  group: source-class-ast-r130-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install package
        run: python -m pip install -e .
      - name: Standalone source AST rename through independent R129 JVM replay
        run: python -m unittest discover -s tests -p "test_private_single_class_ast_rename_r130.py" -v
      - name: Python compilation
        run: python -m compileall -q src/spk_recovery/private_single_class_ast_rename_r130.py
