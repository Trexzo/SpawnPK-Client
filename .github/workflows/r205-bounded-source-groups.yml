name: R205 bounded Java11 source clusters
on:
  pull_request:
    paths:
      - 'tools/bounded_source_groups_r205.py'
      - 'tests/test_bounded_source_groups_r205.py'
      - '.github/workflows/r205-bounded-source-groups.yml'
  workflow_dispatch:
jobs:
  source-clusters:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Compile synthetic linked Java 11 clusters
        run: python -m unittest discover -s tests -p test_bounded_source_groups_r205.py -v
