name: V309 matrix StringBuilder Java source parity R156
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_matrix_packet_loader_parity_r153.py"
      - "tests/test_private_v309_matrix_string_source_parity_r156.py"
      - ".github/workflows/client-matrix-string-r156.yml"
  workflow_dispatch:

concurrency:
  group: v309-matrix-string-r156-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  string-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install v309 Java source recovery helpers
        run: python -m pip install -e .
      - name: Recompile original-style matrix string formatting with Euler dependencies
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_string_source_parity_r156.py" -v
      - name: Preserve projection source recovery regression
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_transform_projection_parity_r155.py" -v
      - name: Python syntax check
        run: python -m compileall -q src/spk_recovery/private_v309_matrix_packet_loader_parity_r153.py
