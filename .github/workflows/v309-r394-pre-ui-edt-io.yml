name: v309 R394 pre-UI EDT/I-O witness (public synthetic only)
on:
  push:
    branches:
      - 'research/v309-r394-*'
  pull_request:
    paths:
      - 'tools/r394/**'
      - 'tests/test_v309_r394_pre_ui_edr_io.py'
      - 'docs/V309_R394_PRE_UI_EDT_IO.md'
      - '.github/workflows/v309-r394-pre-ui-edt-io.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / JDK21
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: R394 static witness and headless synthetic EDT order checks
        run: python -m unittest discover -s tests -p 'test_v309_r394_pre_ui_edr_io.py' -v
