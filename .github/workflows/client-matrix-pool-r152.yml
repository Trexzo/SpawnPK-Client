name: V309 original linked matrix pool factory source parity R152
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_matrix_source_method_parity_r150.py"
      - "tests/test_private_v309_matrix_pool_source_parity_r152.py"
      - ".github/workflows/client-matrix-pool-r152.yml"
  workflow_dispatch:

concurrency:
  group: v309-matrix-pool-r152-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix-pool-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install client source recovery package
        run: python -m pip install -e .
      - name: Verify linked pool acquire/recycle/static initializer source compilation
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_pool_source_parity_r152.py" -v
      - name: Keep R151 constructor source tests green
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_constructor_reset_parity_r151.py" -v
      - name: Keep R150 six-method source tests green
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_source_method_parity_r150.py" -v
