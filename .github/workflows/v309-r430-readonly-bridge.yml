name: v309-r430-existing-journal-readonly-bridge
on:
  push:
    branches:
      - research/v309-r430-existing-journal-readonly-admission-bridge
  pull_request:
    paths:
      - tools/r430/**
      - tests/test_v309_r430_*.py
      - .github/workflows/v309-r430-readonly-bridge.yml
      - docs/V309_R430_EXISTING_JOURNAL_CONTRACT.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  existing-r417-protocol-readonly-restart:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Cross-protocol R415-R417 read-only admission tests and synthetic private-source negatives
        run: python -m unittest discover -s tests -p 'test_v309_r430_*.py' -v
