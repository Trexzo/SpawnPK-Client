name: v309-r418-cooperative-writer-lease
on:
  push:
    branches:
      - research/v309-r418-cooperative-lease-session-fence
  pull_request:
    paths:
      - tools/r418/**
      - tests/fixtures/r418/**
      - tests/test_v309_r418_*.py
      - .github/workflows/v309-r418-cooperative-lease.yml
      - docs/V309_R418_COOPERATIVE_LEASE_AND_ADOPTION.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cooperative-lease-and-adoption-model:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Invented R418 real-TEMP cross-process lease, UI-adoption, SHA-gate negatives
        run: python -m unittest discover -s tests -p 'test_v309_r418_*.py' -v
