name: R202 expanded standalone Java11 sources
on:
  pull_request:
    paths:
      - 'tools/expand_closed_java11_subset_r202.py'
      - 'tests/test_expand_closed_java11_subset_r202.py'
      - '.github/workflows/r202-java11-expanded.yml'
  workflow_dispatch:
jobs:
  subset:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Verify JDK-only intra-source Java compilation
        run: python -m unittest discover -s tests -p 'test_expand_closed_java11_subset_r202.py' -v
