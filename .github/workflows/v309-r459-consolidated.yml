name: v309-r459-consolidated-inspection
on:
  push:
    branches:
      - research/v309-r459-consolidated-inspection
  pull_request:
    paths:
      - tools/r459/**
      - tests/test_v309_r459_*.py
      - docs/V309_R459_CONSOLIDATED_INSPECTION.md
      - .github/workflows/v309-r459-consolidated.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-class-read-sha-verified-static-evidence:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: R459 consolidated one-evidence-read and immutable byte parser reuse tests
        run: python -B -m unittest discover -s tests -p 'test_v309_r459_*.py' -v
      - name: Inherited R458 invokedynamic bootstrap MethodHandle and condy
        run: python -B -m unittest discover -s tests -p 'test_v309_r458_*.py' -v
      - name: Inherited R457 JVM invocation slots and constructor constraints
        run: python -B -m unittest discover -s tests -p 'test_v309_r457_*.py' -v
      - name: Inherited R456 actual Java bytecode member opcode evidence
        run: python -B -m unittest discover -s tests -p 'test_v309_r456_*.py' -v
      - name: Inherited R455 selected dependency fields and method access checks
        run: python -B -m unittest discover -s tests -p 'test_v309_r455_*.py' -v
      - name: Inherited R454 reconstructed inheritance
        run: python -B -m unittest discover -s tests -p 'test_v309_r454_*.py' -v
      - name: Inherited R453 declared member and constant pool reference index
        run: python -B -m unittest discover -s tests -p 'test_v309_r453_*.py' -v
      - name: Inherited R452 bounded resource argument control flow
        run: python -B -m unittest discover -s tests -p 'test_v309_r452_*.py' -v
      - name: Inherited R451 straightline String operand tracing
        run: python -B -m unittest discover -s tests -p 'test_v309_r451_*.py' -v
      - name: Inherited R450 code and generic Signature validation
        run: python -B -m unittest discover -s tests -p 'test_v309_r450_*.py' -v
      - name: Inherited R449 resource and type descriptor candidates
        run: python -B -m unittest discover -s tests -p 'test_v309_r449_*.py' -v
      - name: Inherited R448 class reference inventory
        run: python -B -m unittest discover -s tests -p 'test_v309_r448_*.py' -v
      - name: Inherited R447 pinned original v309 and dependency archive admission
        run: python -B -m unittest discover -s tests -p 'test_v309_r447_*.py' -v
      - name: Inherited R446 complete owner source/class/dependency SHA gates
        run: python -B -m unittest discover -s tests -p 'test_v309_r446_*.py' -v
      - name: Inherited R445 bounded nofollow owner TEMP reads
        run: python -B -m unittest discover -s tests -p 'test_v309_r445_*.py' -v
      - name: Inherited R442 independently approved historical R421 manifest denial
        run: python -B -m unittest discover -s tests -p 'test_v309_r442_*.py' -v
      - name: Inherited R426 fake Java11 Store compilation safety gates
        run: python -B -m unittest discover -s tests -p 'test_v309_r426_full_mock_pipeline.py' -v
