name: V309 gambling/overlay real Java R223
on:
  pull_request:
    paths:
      - 'src/spk_recovery/private_v309_gambling_source_closure_r223.py'
      - 'tests/test_private_v309_gambling_source_closure_r223.py'
      - '.github/workflows/client-real-gambling-source-r223.yml'
  workflow_dispatch:
jobs:
  java9-real-source-fixtures:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_private_v309_gambling_source_closure_r223.py -v
      - run: python -m unittest discover -s tests -p test_private_v309_spellbook_real_dependencies_r222.py -v
      - run: python -m compileall -q src/spk_recovery/private_v309_gambling_source_closure_r223.py
