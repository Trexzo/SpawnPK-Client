name: V309 private import overlay R139 smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_import_overlay_r139.py"
      - "src/spk_recovery/java/PrivateSingleImportSpansR139.java"
      - "tests/test_private_v309_import_overlay_r139.py"
      - ".github/workflows/client-import-overlay-r139.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install source recovery package
        run: python -m pip install -e .
      - name: Verify AST import edits and Java compilation against R138 remap
        run: python -m unittest discover -s tests -p "test_private_v309_import_overlay_r139.py" -v
      - name: Syntax check
        run: python -m compileall -q src/spk_recovery/private_v309_import_overlay_r139.py
