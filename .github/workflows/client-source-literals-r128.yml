name: V309 source constant-pool literal smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_source_literal_corroboration_r128.py"
      - "src/spk_recovery/java/ClientAstStringLiteralWitnessR128.java"
      - "tests/test_private_source_literal_corroboration_r128.py"
      - ".github/workflows/client-source-literals-r128.yml"
  workflow_dispatch:

concurrency:
  group: client-source-literals-r128-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install package
        run: python -m pip install -e .
      - name: R128 synthetic source and JVM string witness tests
        run: python -m unittest discover -s tests -p "test_private_source_literal_corroboration_r128.py" -v
      - name: Compile Python
        run: python -m compileall -q src/spk_recovery/private_source_literal_corroboration_r128.py
