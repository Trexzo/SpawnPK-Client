name: V309 original Packet 73 source methods R178
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_packet_73_methods_r178.py"
      - "tests/test_private_v309_packet_73_methods_r178.py"
      - ".github/workflows/client-packet-73-methods-r178.yml"
  workflow_dispatch:
jobs:
  source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - name: Verify partial Packet Java with actual-source superclass hierarchy
        run: python -m unittest discover -s tests -p "test_private_v309_packet_73_methods_r178.py" -v
      - name: Original full superclass regression
        run: python -m unittest discover -s tests -p "test_private_v309_packet_parent_source_r177.py" -v
      - run: python -m compileall -q src/spk_recovery/private_v309_packet_73_methods_r178.py
