name: v309 R220 cache transaction public tests
on:
  push:
    paths:
      - 'tools/java/r220/**'
      - 'tools/java/r222/**'
      - 'tests/java/r220/**'
      - 'tests/java/r222/**'
      - '.github/workflows/client-r220-cache-transaction.yml'
  pull_request:
    paths:
      - 'tools/java/r220/**'
      - 'tools/java/r222/**'
      - 'tests/java/r220/**'
      - 'tests/java/r222/**'
      - '.github/workflows/client-r220-cache-transaction.yml'
  workflow_dispatch:
jobs:
  java11-cache-transaction:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Compile source-independent production helper and smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path r220-test-out -Force | Out-Null
          javac --release 11 -d r220-test-out tools/java/r220/CacheUpdateTransaction.java tests/java/r220/R220PublicTransactionSmoke.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp r220-test-out rs.cache.updater.assets.R220PublicTransactionSmoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile and exercise R222 root-isolated cache helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path r222-test-out -Force | Out-Null
          javac --release 11 -d r222-test-out tools/java/r222/CacheUpdateTransaction.java tests/java/r222/R222RootIsolationSmoke.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp r222-test-out rs.cache.updater.assets.R222RootIsolationSmoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
