name: v309 R376 portable provider diagnostics (public-only)
on:
  pull_request:
    paths:
      - '.github/workflows/v309-r376-portable-diagnostics.yml'
      - 'scripts/verify_v309_r376_portable_diagnostics.py'
      - 'tests/test_v309_r376_portable_diagnostics.py'
      - 'research/v309-source-recovery/r376-portable-diagnostics-witness.json'
      - 'docs/V309_R376_PORTABLE_DIRECTORY_DIAGNOSTICS.md'
      - 'tools/r376/DirectoryForceProbe.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-probe-and-synthetic-receipt:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / JDK 21
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Public synthetic SHA-pinned archive verifier tests only
        run: python -m unittest discover -s tests -p 'test_v309_r376_portable_diagnostics.py' -v
      - name: Compile generic directory-force capability probe (no private code)
        run: javac --release 11 tools/r376/DirectoryForceProbe.java
      - name: Observe this runner's directory-force support
        run: java -cp tools/r376 DirectoryForceProbe
