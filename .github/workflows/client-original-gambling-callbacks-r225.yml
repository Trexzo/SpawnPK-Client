name: V309 original gambling callbacks JVM Code R225
on:
  pull_request:
    paths:
      - 'src/spk_recovery/private_v309_gambling_callback_original_code_r225.py'
      - 'tests/test_private_v309_gambling_callback_original_code_r225.py'
      - '.github/workflows/client-original-gambling-callbacks-r225.yml'
  workflow_dispatch:
jobs:
  source-callbacks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_private_v309_gambling_callback_original_code_r225.py -v
      - run: python -m unittest discover -s tests -p test_private_v309_gambling_widget_original_code_r224.py -v
      - run: python -m compileall -q src/spk_recovery/private_v309_gambling_callback_original_code_r225.py
