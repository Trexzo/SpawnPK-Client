name: v309-r466-adaptive-hierarchy
on:
  push:
    branches: [research/v309-r466-adaptive-hierarchy]
  pull_request:
    paths:
      - tools/r466/**
      - tools/r459/audit_consolidated_inspection.py
      - tests/test_v309_r466_*.py
      - docs/V309_R466_ADAPTIVE_HIERARCHY.md
      - .github/workflows/v309-r466-adaptive-hierarchy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adaptive-cache-with-negative-controls:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: R466 selective graph policy and independent/forced/adaptive parity
        run: python -B -m unittest discover -s tests -p 'test_v309_r466_*.py' -v
      - name: R465 inherited synthetic and integrity regression
        run: python -B -m unittest discover -s tests -p 'test_v309_r465_*.py' -v
      - name: R464 inherited synthetic and integrity regression
        run: python -B -m unittest discover -s tests -p 'test_v309_r464_*.py' -v
      - name: R463 inherited synthetic and integrity regression
        run: python -B -m unittest discover -s tests -p 'test_v309_r463_*.py' -v
      - name: R462 inherited synthetic and integrity regression
        run: python -B -m unittest discover -s tests -p 'test_v309_r462_*.py' -v
      - name: R461 inherited synthetic and integrity regression
        run: python -B -m unittest discover -s tests -p 'test_v309_r461_*.py' -v
      - name: R460 inherited synthetic and integrity regression
        run: python -B -m unittest discover -s tests -p 'test_v309_r460_*.py' -v
      - name: R459 inherited synthetic and integrity regression
        run: python -B -m unittest discover -s tests -p 'test_v309_r459_*.py' -v
      - name: R456 inherited synthetic and integrity regression
        run: python -B -m unittest discover -s tests -p 'test_v309_r456_*.py' -v
      - name: R455 inherited synthetic and integrity regression
        run: python -B -m unittest discover -s tests -p 'test_v309_r455_*.py' -v
      - name: R454 inherited synthetic and integrity regression
        run: python -B -m unittest discover -s tests -p 'test_v309_r454_*.py' -v
      - name: R442 inherited synthetic and integrity regression
        run: python -B -m unittest discover -s tests -p 'test_v309_r442_*.py' -v
