name: v309 R370 version receipt source witness (synthetic only)
on:
  pull_request:
    paths:
      - '.github/workflows/v309-r370-version-receipt.yml'
      - 'scripts/verify_v309_r370_version_receipt.py'
      - 'tests/test_v309_r370_version_receipt.py'
      - 'research/v309-source-recovery/r370-version-receipt-witness.json'
      - 'docs/V309_R370_VERSION_RECEIPT_REPLAY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only-witness:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: R370 synthetic archive and release-gate checks (no private source)
        run: python -m unittest discover -s tests -p 'test_v309_r370_version_receipt.py' -v
