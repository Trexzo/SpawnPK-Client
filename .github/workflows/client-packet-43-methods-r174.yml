name: V309 original Packet 43 source methods R174
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_packet_43_methods_r174.py"
      - "tests/test_private_v309_packet_43_methods_r174.py"
      - ".github/workflows/client-packet-43-methods-r174.yml"
  workflow_dispatch:
jobs:
  source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - name: Recompile and verify 43 original Packet method source bodies
        run: python -m unittest discover -s tests -p "test_private_v309_packet_43_methods_r174.py" -v
      - name: R173 writer regression
        run: python -m unittest discover -s tests -p "test_private_v309_packet_34_methods_r173.py" -v
      - run: python -m compileall -q src/spk_recovery/private_v309_packet_43_methods_r174.py
