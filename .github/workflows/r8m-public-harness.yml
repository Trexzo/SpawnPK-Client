name: R8M validated patch carrier

on:
  push:
    branches:
      - core/r8m-public-harness

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/r8m-hierarchy-shadow-static-fields-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ba7d637da5f26193a5e497aa1432fcfcc5db874e"
      - name: Decode and verify validated patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' > /tmp/r8m.patch.gz.b64
          base64 -d /tmp/r8m.patch.gz.b64 | gzip -d > /tmp/r8m.patch
          echo "14e75708bb8414fa9bc54e6d587831ad50a7187d1ac1ac786a8124c461f6c00d  /tmp/r8m.patch" | sha256sum -c -
          git apply --check /tmp/r8m.patch
          git apply /tmp/r8m.patch
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/spk_recovery/source_normalization.py tests/test_source_normalization.py "
      - name: Validate focused recovery surface
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest             tests.test_source_normalization             tests.test_source_workspace             tests.test_project_source_scope -v
          PYTHONPATH=src python -m compileall -q src tests
      - name: Commit and push R8M refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Trexzo"
          git config user.email "45512387+Trexzo@users.noreply.github.com"
          git add src/spk_recovery/source_normalization.py tests/test_source_normalization.py
          git commit -m "R8M: refine exact hierarchy-shadow qualification"
          git push origin HEAD:core/r8m-hierarchy-shadow-static-fields-v2
