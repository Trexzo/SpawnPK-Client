name: R8M public source harness

on:
  push:
    branches:
      - core/r8m-public-harness

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload public repository source
        uses: actions/upload-artifact@v4
        with:
          name: r8m-public-source-harness
          path: |
            pyproject.toml
            README.md
            BOOTSTRAP.ps1
            INDEX_V308.ps1
            authority
            evidence
            generated
            mappings
            research
            schemas
            src
            tests
            docs
            scripts
          if-no-files-found: error
          retention-days: 1

      - name: Fetch pinned Procyon
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o procyon-decompiler-0.6.0.jar \
            https://github.com/mstrobel/procyon/releases/download/v0.6.0/procyon-decompiler-0.6.0.jar
          echo "821da96012fc69244fa1ea298c90455ee4e021434bc796d3b9546ab24601b779  procyon-decompiler-0.6.0.jar" | sha256sum -c -
      - name: Upload pinned Procyon
        uses: actions/upload-artifact@v4
        with:
          name: procyon-decompiler-0.6.0
          path: procyon-decompiler-0.6.0.jar
          retention-days: 1
