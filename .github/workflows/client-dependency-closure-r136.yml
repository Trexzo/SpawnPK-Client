name: V309 original dependency closure smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_dependency_closure_r136.py"
      - "tests/test_private_v309_dependency_closure_r136.py"
      - ".github/workflows/client-dependency-closure-r136.yml"
  workflow_dispatch:

concurrency:
  group: v309-dependency-closure-r136-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install package
        run: python -m pip install -e .
      - name: Synthetic Java9 original game dependency closure and vetoes
        run: python -m unittest discover -s tests -p "test_private_v309_dependency_closure_r136.py" -v
      - name: Compile Python
        run: python -m compileall -q src/spk_recovery/private_v309_dependency_closure_r136.py
