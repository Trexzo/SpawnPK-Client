name: V309 private source attributed calls smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_client_source_attributed_invokes_r131.py"
      - "src/spk_recovery/java/ClientAttributedCallEdgesR131.java"
      - "tests/test_private_client_source_attributed_invokes_r131.py"
      - ".github/workflows/client-source-attributed-r131.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install package
        run: python -m pip install -e .
      - name: Synthetic JavacTask attributed client invocations
        run: python -m unittest discover -s tests -p "test_private_client_source_attributed_invokes_r131.py" -v
      - name: Compile Python wrapper
        run: python -m compileall -q src/spk_recovery/private_client_source_attributed_invokes_r131.py
