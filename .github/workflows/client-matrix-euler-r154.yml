name: V309 matrix Euler Java source parity R154
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_matrix_packet_loader_parity_r153.py"
      - "tests/test_private_v309_matrix_euler_source_parity_r154.py"
      - ".github/workflows/client-matrix-euler-r154.yml"
  workflow_dispatch:

concurrency:
  group: v309-matrix-euler-r154-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  euler-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install v309 original client source recovery package
        run: python -m pip install -e .
      - name: Recompile synthetic source Euler calculations with original game-linked matrix signatures
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_euler_source_parity_r154.py" -v
      - name: Preserve R153 Packet loader source-only regression
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_packet_loader_parity_r153.py" -v
      - name: Python syntax check
        run: python -m compileall -q src/spk_recovery/private_v309_matrix_packet_loader_parity_r153.py
