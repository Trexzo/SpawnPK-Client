name: V309 actual readable spellbook Code R212
on:
  pull_request:
    paths:
      - 'src/spk_recovery/private_v309_readable_spellbook_three_methods_r212.py'
      - 'tests/test_private_v309_readable_spellbook_three_methods_r212.py'
      - '.github/workflows/client-readable-spellbook-code-r212.yml'
  workflow_dispatch:
jobs:
  recovered-code:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_private_v309_readable_spellbook_three_methods_r212.py -v
      - run: python -m unittest discover -s tests -p test_private_v309_spellbook_complete_crosswalk_r211.py -v
      - run: python -m compileall -q src/spk_recovery/private_v309_readable_spellbook_three_methods_r212.py
