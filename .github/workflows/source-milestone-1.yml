name: Source Milestone 1

on:
  workflow_dispatch:
    inputs:
      authority_run_id:
        description: GitHub Actions run containing the Source M1 authority artifact
        required: true
        type: string
      authority_artifact_name:
        description: Source M1 authority artifact name
        required: true
        default: spawnpk-v308-source-authority
        type: string
      authority_commit:
        description: Exact SpawnPK-Client authority commit (lowercase 40 hex)
        required: true
        type: string
  workflow_call:
    inputs:
      authority_run_id:
        description: Optional prior run ID; blank consumes the caller run artifact
        required: false
        default: ""
        type: string
      authority_artifact_name:
        description: Source M1 authority artifact name
        required: false
        default: spawnpk-v308-source-authority
        type: string
      authority_commit:
        description: Exact SpawnPK-Client authority commit (lowercase 40 hex)
        required: true
        type: string
    outputs:
      milestone_id:
        description: Verified Source Milestone manifest ID
        value: ${{ jobs.verify-source-milestone.outputs.milestone_id }}
      bundle_id:
        description: Verified source publication bundle ID
        value: ${{ jobs.verify-source-milestone.outputs.bundle_id }}
      authority_verification_id:
        description: Source authority artifact verification ID
        value: ${{ jobs.verify-source-milestone.outputs.authority_verification_id }}
      bundle_verification_id:
        description: Source publication bundle verification ID
        value: ${{ jobs.verify-source-milestone.outputs.bundle_verification_id }}
      source_tree_sha256:
        description: Canonical verified Java source-tree SHA-256
        value: ${{ jobs.verify-source-milestone.outputs.source_tree_sha256 }}
      publication_artifact_name:
        description: Uploaded verified Source Milestone artifact name
        value: ${{ jobs.verify-source-milestone.outputs.publication_artifact_name }}

permissions:
  contents: read
  actions: read

jobs:
  verify-source-milestone:
    runs-on: ubuntu-latest
    outputs:
      milestone_id: ${{ steps.result.outputs.milestone_id }}
      bundle_id: ${{ steps.result.outputs.bundle_id }}
      authority_verification_id: ${{ steps.result.outputs.authority_verification_id }}
      bundle_verification_id: ${{ steps.result.outputs.bundle_verification_id }}
      source_tree_sha256: ${{ steps.result.outputs.source_tree_sha256 }}
      publication_artifact_name: ${{ steps.result.outputs.publication_artifact_name }}
    steps:
      - name: Validate authority commit syntax
        shell: bash
        env:
          AUTHORITY_COMMIT: ${{ inputs.authority_commit }}
        run: |
          set -euo pipefail
          if ! [[ "$AUTHORITY_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "authority_commit must be exact lowercase 40-hex" >&2
            exit 2
          fi

      - name: Checkout exact recovery tooling
        uses: actions/checkout@v4
        with:
          repository: Trexzo/SpawnPK-Client
          ref: ${{ inputs.authority_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact recovery tooling checkout
        shell: bash
        env:
          AUTHORITY_COMMIT: ${{ inputs.authority_commit }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$AUTHORITY_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install recovery tooling
        run: python -m pip install -e .

      - name: Validate prior Source M1 authority run provenance
        if: ${{ inputs.authority_run_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL_VALUE: ${{ github.api_url }}
          GITHUB_REPOSITORY_VALUE: ${{ github.repository }}
          AUTHORITY_REPOSITORY_VALUE: Trexzo/SpawnPK-Client
          AUTHORITY_RUN_ID: ${{ inputs.authority_run_id }}
          AUTHORITY_COMMIT: ${{ inputs.authority_commit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          run_id = os.environ["AUTHORITY_RUN_ID"]
          repository = os.environ["GITHUB_REPOSITORY_VALUE"]
          authority_repository = os.environ[
              "AUTHORITY_REPOSITORY_VALUE"
          ]
          api_url = os.environ["GITHUB_API_URL_VALUE"].rstrip("/")
          token = os.environ["GH_TOKEN"]
          authority_commit = os.environ["AUTHORITY_COMMIT"]

          if not re.fullmatch(r"[1-9][0-9]*", run_id):
              raise SystemExit(
                  "authority_run_id must be a positive decimal run ID"
              )

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(
                  request,
                  timeout=30,
              ) as response:
                  return json.load(response)

          run = get_json(
              f"{api_url}/repos/{repository}/actions/runs/{run_id}"
          )
          run_repository = (
              (run.get("repository") or {}).get("full_name")
          )
          if run_repository != repository:
              raise SystemExit(
                  "authority run repository mismatch: "
                  f"{run_repository!r}"
              )
          if (
              run.get("status") != "completed"
              or run.get("conclusion") != "success"
          ):
              raise SystemExit(
                  "authority run must be completed successfully"
              )

          head_sha = run.get("head_sha")
          if not isinstance(head_sha, str) or not re.fullmatch(
              r"[0-9a-f]{40}",
              head_sha,
          ):
              raise SystemExit(
                  "authority run head SHA is not lowercase 40-hex"
              )

          if repository == authority_repository:
              comparison = get_json(
                  f"{api_url}/repos/{repository}/compare/"
                  f"{authority_commit}...{head_sha}"
              )
              if comparison.get("status") not in {
                  "ahead",
                  "identical",
              }:
                  raise SystemExit(
                      "authority commit is not an ancestor of "
                      "the authority run head"
                  )
          else:
              print(
                  "cross-repository caller: authority ancestry "
                  "is bound by exact tooling checkout and semantic "
                  "authority verification"
              )

          print(
              "validated prior authority run "
              f"{run_id} at head {head_sha}"
          )
          PY

      - name: Download Source M1 authority artifact from caller run
        if: ${{ inputs.authority_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.authority_artifact_name }}
          path: authority

      - name: Download Source M1 authority artifact from prior run
        if: ${{ inputs.authority_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.authority_artifact_name }}
          path: authority
          github-token: ${{ github.token }}
          run-id: ${{ inputs.authority_run_id }}

      - name: Validate authority artifact contract
        shell: bash
        run: |
          set -euo pipefail
          test -f authority/SOURCE-AUTHORITY-ARTIFACT.json
          test -f authority/class-lineage.json
          test -f authority/member-lineage.json
          test -f authority/readable-client-manifest.json
          test -f authority/recovered-source-manifest.json
          test -f authority/clean-rebuild.json
          test -f authority/recovery-release.json
          test -f authority/release-verification.json
          test -d authority/src

      - name: Verify Source M1 authority artifact
        shell: bash
        env:
          AUTHORITY_COMMIT: ${{ inputs.authority_commit }}
        run: |
          set -euo pipefail
          mkdir -p source-m1/verification

          python -m spk_recovery.source_authority_artifact_cli verify \
            --artifact-dir authority \
            --expected-authority-commit "$AUTHORITY_COMMIT" \
            --out source-m1/verification/SOURCE-AUTHORITY-VERIFICATION.json

      - name: Build Source Milestone 1 manifest
        shell: bash
        env:
          AUTHORITY_COMMIT: ${{ inputs.authority_commit }}
        run: |
          set -euo pipefail
          python -m spk_recovery.source_milestone_cli build \
            --authority-commit "$AUTHORITY_COMMIT" \
            --class-lineage authority/class-lineage.json \
            --member-lineage authority/member-lineage.json \
            --readable-manifest authority/readable-client-manifest.json \
            --recovered-manifest authority/recovered-source-manifest.json \
            --clean-rebuild authority/clean-rebuild.json \
            --release-manifest authority/recovery-release.json \
            --release-verification authority/release-verification.json \
            --source-root authority/src \
            --out source-m1/SOURCE-MILESTONE.json

      - name: Exactly reproduce milestone manifest
        shell: bash
        env:
          AUTHORITY_COMMIT: ${{ inputs.authority_commit }}
        run: |
          set -euo pipefail

          python -m spk_recovery.source_milestone_cli verify \
            --authority-commit "$AUTHORITY_COMMIT" \
            --class-lineage authority/class-lineage.json \
            --member-lineage authority/member-lineage.json \
            --readable-manifest authority/readable-client-manifest.json \
            --recovered-manifest authority/recovered-source-manifest.json \
            --clean-rebuild authority/clean-rebuild.json \
            --release-manifest authority/recovery-release.json \
            --release-verification authority/release-verification.json \
            --source-root authority/src \
            --manifest source-m1/SOURCE-MILESTONE.json \
            --out source-m1/verification/SOURCE-MILESTONE-VERIFICATION.json

      - name: Build source-only publication bundle
        shell: bash
        run: |
          set -euo pipefail

          python -m spk_recovery.source_milestone_cli bundle \
            --manifest source-m1/SOURCE-MILESTONE.json \
            --source-root authority/src \
            --out-dir source-m1/publication \
            --provenance source-authority-artifact.json=authority/SOURCE-AUTHORITY-ARTIFACT.json \
            --provenance source-authority-verification.json=source-m1/verification/SOURCE-AUTHORITY-VERIFICATION.json \
            --provenance class-lineage.json=authority/class-lineage.json \
            --provenance member-lineage.json=authority/member-lineage.json \
            --provenance readable-client-manifest.json=authority/readable-client-manifest.json \
            --provenance recovered-source-manifest.json=authority/recovered-source-manifest.json \
            --provenance clean-rebuild.json=authority/clean-rebuild.json \
            --provenance recovery-release.json=authority/recovery-release.json \
            --provenance release-verification.json=authority/release-verification.json \
            --provenance source-milestone-verification.json=source-m1/verification/SOURCE-MILESTONE-VERIFICATION.json

      - name: Verify publication bundle
        shell: bash
        env:
          AUTHORITY_COMMIT: ${{ inputs.authority_commit }}
        run: |
          set -euo pipefail

          python -m spk_recovery.source_milestone_cli verify-bundle \
            --bundle-dir source-m1/publication \
            --manifest source-m1/SOURCE-MILESTONE.json \
            --expected-authority-commit "$AUTHORITY_COMMIT" \
            --out source-m1/verification/SOURCE-BUNDLE-VERIFICATION.json

      - name: Reject binaries outside verifier contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          publication = Path("source-m1/publication")
          allowed = {
              publication / "BUNDLE.json",
              publication / "SOURCE-MILESTONE.json",
          }

          bad = []
          for path in publication.rglob("*"):
              if not path.is_file():
                  continue
              if path in allowed:
                  continue
              rel = path.relative_to(publication).as_posix()
              if rel.startswith("src/") and path.suffix == ".java":
                  continue
              if (
                  rel.startswith("provenance/")
                  and path.suffix == ".json"
                  and "/" not in rel[len("provenance/"):]
              ):
                  continue
              bad.append(rel)

          if bad:
              raise SystemExit(
                  "publication bundle contains forbidden files: "
                  + ", ".join(sorted(bad))
              )
          PY

      - name: Export verified workflow outputs
        id: result
        shell: bash
        env:
          AUTHORITY_COMMIT: ${{ inputs.authority_commit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          milestone = json.loads(
              Path("source-m1/SOURCE-MILESTONE.json").read_text(
                  encoding="utf-8"
              )
          )
          bundle = json.loads(
              Path(
                  "source-m1/publication/BUNDLE.json"
              ).read_text(encoding="utf-8")
          )
          authority_verification = json.loads(
              Path(
                  "source-m1/verification/"
                  "SOURCE-AUTHORITY-VERIFICATION.json"
              ).read_text(encoding="utf-8")
          )
          bundle_verification = json.loads(
              Path(
                  "source-m1/verification/"
                  "SOURCE-BUNDLE-VERIFICATION.json"
              ).read_text(encoding="utf-8")
          )

          if not authority_verification.get("verified"):
              raise SystemExit(
                  "authority artifact verification is not true"
              )
          if not bundle_verification.get("verified"):
              raise SystemExit(
                  "publication bundle verification is not true"
              )
          if not milestone.get("publishable"):
              raise SystemExit(
                  "source milestone publishable is not true"
              )

          values = {
              "milestone_id": milestone["milestone_id"],
              "bundle_id": bundle["bundle_id"],
              "authority_verification_id": (
                  authority_verification["verification_id"]
              ),
              "bundle_verification_id": (
                  bundle_verification["verification_id"]
              ),
              "source_tree_sha256": (
                  milestone["source_tree"]["sha256"]
              ),
              "publication_artifact_name": (
                  "spawnpk-source-m1-"
                  + os.environ["AUTHORITY_COMMIT"]
              ),
          }
          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
              newline="\n",
          ) as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
          PY

      - name: Upload verified Source Milestone artifact
        uses: actions/upload-artifact@v4
        with:
          name: spawnpk-source-m1-${{ inputs.authority_commit }}
          path: source-m1
          if-no-files-found: error
          retention-days: 30
