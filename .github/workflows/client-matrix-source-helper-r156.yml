name: V309 source-only matrix helper compiler R156
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_matrix_source_method_parity_r150.py"
      - "tests/test_private_v309_matrix_source_helper_r156.py"
      - ".github/workflows/client-matrix-source-helper-r156.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install original source-recovery helpers
        run: python -m pip install -e .
      - name: Test source-only original matrix helpers and negative provenance
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_source_helper_r156.py" -v
      - name: R155 source-closure regression
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_source_closure_r155.py" -v
      - name: R150 strict original matrix method regression
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_source_method_parity_r150.py" -v
