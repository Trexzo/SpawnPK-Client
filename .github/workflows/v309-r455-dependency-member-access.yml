name: v309-r455-dependency-member-access
on:
  push:
    branches:
      - research/v309-r455-dependency-member-access
  pull_request:
    paths:
      - tools/r455/**
      - tools/r453/classfile_member_reference.py
      - tests/test_v309_r455_*.py
      - docs/V309_R455_DEPENDENCY_MEMBER_ACCESS.md
      - .github/workflows/v309-r455-dependency-member-access.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-java-dependency-member-access:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: R455 fabricated Java8–11 preferred dependency member declarations and access risks
        run: python -B -m unittest discover -s tests -p 'test_v309_r455_*.py' -v
      - name: Inherited R454 superclass-interface signature ancestry and private custody
        run: python -B -m unittest discover -s tests -p 'test_v309_r454_*.py' -v
      - name: Inherited R453 declared fields/methods CP signatures
        run: python -B -m unittest discover -s tests -p 'test_v309_r453_*.py' -v
      - name: Inherited R452 forward branch resource argument safety
        run: python -B -m unittest discover -s tests -p 'test_v309_r452_*.py' -v
      - name: Inherited R451 straight-line operand signature checks
        run: python -B -m unittest discover -s tests -p 'test_v309_r451_*.py' -v
      - name: Inherited R450 Java11 generic Signature and resource candidates
        run: python -B -m unittest discover -s tests -p 'test_v309_r450_*.py' -v
      - name: Inherited R449 descriptor and resource string candidate census
        run: python -B -m unittest discover -s tests -p 'test_v309_r449_*.py' -v
      - name: Inherited R448 constant class reference coverage
        run: python -B -m unittest discover -s tests -p 'test_v309_r448_*.py' -v
      - name: Inherited R447 SHA-pinned v309 JAR and dependency ZIP admission
        run: python -B -m unittest discover -s tests -p 'test_v309_r447_*.py' -v
      - name: Inherited R446 read-only source/class/dependency SHA gates
        run: python -B -m unittest discover -s tests -p 'test_v309_r446_*.py' -v
      - name: Inherited R445 nofollow bounded owner-isolated file reads
        run: python -B -m unittest discover -s tests -p 'test_v309_r445_*.py' -v
      - name: Inherited R442 independent historical R421 custody refusal
        run: python -B -m unittest discover -s tests -p 'test_v309_r442_*.py' -v
      - name: Inherited R426 invented Java11 Store compile acceptance
        run: python -B -m unittest discover -s tests -p 'test_v309_r426_full_mock_pipeline.py' -v
