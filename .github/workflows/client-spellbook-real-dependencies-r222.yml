name: V309 real widget and enum source closure R222
on:
  pull_request:
    paths:
      - 'src/spk_recovery/private_v309_spellbook_real_dependencies_r222.py'
      - 'tests/test_private_v309_spellbook_real_dependencies_r222.py'
      - '.github/workflows/client-spellbook-real-dependencies-r222.yml'
  workflow_dispatch:
jobs:
  java9-source-closure:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_private_v309_spellbook_real_dependencies_r222.py -v
      - run: python -m unittest discover -s tests -p test_private_v309_unified_spellbook_class_r221.py -v
      - run: python -m compileall -q src/spk_recovery/private_v309_spellbook_real_dependencies_r222.py
