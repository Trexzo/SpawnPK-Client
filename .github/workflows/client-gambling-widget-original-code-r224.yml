name: V309 original gambling widget six-method Code R224
on:
  pull_request:
    paths:
      - 'src/spk_recovery/private_v309_gambling_widget_original_code_r224.py'
      - 'tests/test_private_v309_gambling_widget_original_code_r224.py'
      - '.github/workflows/client-gambling-widget-original-code-r224.yml'
  workflow_dispatch:
jobs:
  jvm-parity:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_private_v309_gambling_widget_original_code_r224.py -v
      - run: python -m unittest discover -s tests -p test_private_v309_gambling_source_closure_r223.py -v
      - run: python -m compileall -q src/spk_recovery/private_v309_gambling_widget_original_code_r224.py
