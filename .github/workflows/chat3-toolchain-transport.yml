name: Chat 3 Toolchain Transport

on:
  pull_request:
    paths:
      - ".github/workflows/chat3-toolchain-transport.yml"

permissions:
  contents: read

jobs:
  package-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact official Procyon 0.6.0
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/mstrobel/procyon/releases/download/v0.6.0/procyon-decompiler-0.6.0.jar"
          expected="821da96012fc69244fa1ea298c90455ee4e021434bc796d3b9546ab24601b779"
          curl --fail --location --retry 3 --output procyon-decompiler-0.6.0.jar "$url"
          actual="$(sha256sum procyon-decompiler-0.6.0.jar | awk '{print $1}')"
          size="$(stat -c %s procyon-decompiler-0.6.0.jar)"
          echo "PROCYON_SHA256=$actual"
          echo "PROCYON_SIZE=$size"
          test "$actual" = "$expected"
          test "$size" = "2004704"
      - name: Package checked-out recovery toolchain
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf spawnpk-client-toolchain.tar.gz .
      - name: Upload exact Procyon
        uses: actions/upload-artifact@v4
        with:
          name: procyon-decompiler-0.6.0-exact-toolchain-run
          path: procyon-decompiler-0.6.0.jar
          if-no-files-found: error
          retention-days: 1
      - name: Upload recovery toolchain snapshot
        uses: actions/upload-artifact@v4
        with:
          name: spawnpk-client-toolchain-snapshot
          path: spawnpk-client-toolchain.tar.gz
          if-no-files-found: error
          retention-days: 1
