name: V309 original four-owner javac frontier R192
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_four_owner_javac_frontier_r192.py"
      - "tests/test_private_v309_four_owner_javac_frontier_r192.py"
      - ".github/workflows/client-four-owner-frontier-r192.yml"
  workflow_dispatch:
jobs:
  source-frontier:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_private_v309_four_owner_javac_frontier_r192.py" -v
      - run: python -m unittest discover -s tests -p "test_private_v309_platform_enum_r191.py" -v
      - run: python -m compileall -q src/spk_recovery/private_v309_four_owner_javac_frontier_r192.py
