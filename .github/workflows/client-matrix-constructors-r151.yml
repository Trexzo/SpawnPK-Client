name: V309 original matrix constructor and identity source parity R151
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_matrix_source_method_parity_r150.py"
      - "tests/test_private_v309_matrix_constructor_reset_parity_r151.py"
      - ".github/workflows/client-matrix-constructors-r151.yml"
  workflow_dispatch:

concurrency:
  group: v309-matrix-constructors-r151-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  original-matrix-constructors:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install recovery tooling
        run: python -m pip install -e .
      - name: Test original-linked constructors, identity reset, zero reset
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_constructor_reset_parity_r151.py" -v
      - name: Preserve R150 six-method source recovery regressions
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_source_method_parity_r150.py" -v
