name: V309 spellbook complete member crosswalk R211
on:
  pull_request:
    paths:
      - 'src/spk_recovery/private_v309_spellbook_complete_crosswalk_r211.py'
      - 'tests/test_private_v309_spellbook_complete_crosswalk_r211.py'
      - '.github/workflows/client-spellbook-complete-crosswalk-r211.yml'
  workflow_dispatch:
jobs:
  source-member-audit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_private_v309_spellbook_complete_crosswalk_r211.py -v
      - run: python -m unittest discover -s tests -p test_private_v309_readable_widget_source_parity_r210.py -v
      - run: python -m compileall -q src/spk_recovery/private_v309_spellbook_complete_crosswalk_r211.py
