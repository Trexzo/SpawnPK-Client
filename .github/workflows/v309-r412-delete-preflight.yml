name: v309 R412 deletion preflight and read-only stage inspection (public synthetic only)
on:
  push:
    branches:
      - 'research/v309-r412-*'
  pull_request:
    paths:
      - 'tools/r412/**'
      - 'tests/test_v309_r412_delete_and_inspector.py'
      - 'tests/fixtures/r412/**'
      - 'docs/V309_R412_DELETE_PREFLIGHT_STAGE_INSPECTOR.md'
      - '.github/workflows/v309-r412-delete-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / JDK21
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: R412 fabricated source/class refusal and explicit-directory inspector tests
        run: python -m unittest discover -s tests -p 'test_v309_r412_delete_and_inspector.py' -v
      - name: R412 standalone synthetic deletion preflight and local writer-lock schedule
        run: |
          python -c "from pathlib import Path; Path('build/r412-synthetic').mkdir(parents=True, exist_ok=True)"
          javac --release 11 -d build/r412-synthetic tests/fixtures/r412/R412DeletePreflightSynthetic.java
          java -cp build/r412-synthetic R412DeletePreflightSynthetic
