name: v309 R381 opaque staging session evidence (public synthetic only)
on:
  pull_request:
    paths:
      - '.github/workflows/v309-r381-opaque-stage-session.yml'
      - 'docs/V309_R381_OPAQUE_STAGE_SESSION_EVIDENCE.md'
      - 'research/v309-source-recovery/r381-session-witness.json'
      - 'scripts/verify_v309_r381_session.py'
      - 'tests/test_v309_r381_session.py'
      - 'tools/r381/OpaqueStageSessionProbe.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-synthetic-and-java-probe:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / JDK21
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic archive verification — no private source
        run: python -m unittest discover -s tests -p 'test_v309_r381_session.py' -v
      - name: Compile public scratch-only JDK probe
        run: javac --release 11 tools/r381/OpaqueStageSessionProbe.java
      - name: Run generic session/lock probe
        run: java -cp tools/r381 OpaqueStageSessionProbe
