name: V309 original Packet 61 source methods R176
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_packet_61_methods_r176.py"
      - "tests/test_private_v309_packet_61_methods_r176.py"
      - ".github/workflows/client-packet-61-methods-r176.yml"
  workflow_dispatch:
jobs:
  original-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - name: Original Packet 61 selected methods Java source and call closure
        run: python -m unittest discover -s tests -p "test_private_v309_packet_61_methods_r176.py" -v
      - name: Original Packet 49 method regression
        run: python -m unittest discover -s tests -p "test_private_v309_packet_49_methods_r175.py" -v
      - run: python -m compileall -q src/spk_recovery/private_v309_packet_61_methods_r176.py
