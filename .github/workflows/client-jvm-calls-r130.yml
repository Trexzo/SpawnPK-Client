name: V309 original JVM call-edge smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_original_jvm_call_edges_r130.py"
      - "tests/test_private_original_jvm_call_edges_r130.py"
      - ".github/workflows/client-jvm-calls-r130.yml"
  workflow_dispatch:

concurrency:
  group: client-jvm-calls-r130-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install package
        run: python -m pip install -e .
      - name: Original JVM invocation edge extraction on isolated Java9 fixtures
        run: python -m unittest discover -s tests -p "test_private_original_jvm_call_edges_r130.py" -v
      - name: Compile Python
        run: python -m compileall -q src/spk_recovery/private_original_jvm_call_edges_r130.py
