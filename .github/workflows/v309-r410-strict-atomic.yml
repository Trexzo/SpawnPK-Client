name: v309 R410 strict history atomic replacement (public synthetic only)
on:
  push:
    branches:
      - 'research/v309-r410-*'
  pull_request:
    paths:
      - 'tools/r410/**'
      - 'tests/test_v309_r410_strict_history_gate.py'
      - 'tests/fixtures/r410/**'
      - 'docs/V309_R410_STRICT_HISTORY_ATOMIC_REPLACE.md'
      - '.github/workflows/v309-r410-strict-atomic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / JDK21
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: R410 source and class scope checks (fabricated public inputs only)
        run: python -m unittest discover -s tests -p 'test_v309_r410_strict_history_gate.py' -v
      - name: R410 standalone strict atomic temporary-file filesystem model
        run: |
          python -c "from pathlib import Path; Path('build/r410-synthetic').mkdir(parents=True, exist_ok=True)"
          javac --release 11 -d build/r410-synthetic tests/fixtures/r410/R410StrictAtomicHistorySynthetic.java
          java -cp build/r410-synthetic R410StrictAtomicHistorySynthetic
