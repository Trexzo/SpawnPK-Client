name: v309-r439-failed-holder-reap-fence
on:
  push:
    branches:
      - research/v309-r439-failed-holder-reap-fence
  pull_request:
    paths:
      - tools/r422/run_private_store_acceptance.py
      - tests/test_v309_r434_bounded_holder_startup.py
      - tests/test_v309_r437_exact_holder_root_rejection.py
      - tests/test_v309_r438_drained_holder_shutdown.py
      - tests/test_v309_r439_failed_holder_cleanup.py
      - .github/workflows/v309-r439-failed-holder-reap.yml
      - docs/V309_R439_FAILED_HOLDER_REAP_FENCE.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kill-join-reap-before-any-owner-receipt:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: R439 failure-path ownership reader join and child reap
        run: python -m unittest discover -s tests -p 'test_v309_r439_*.py' -v
      - name: Inherited R438 OS pipe saturation and shutdown
        run: python -m unittest discover -s tests -p 'test_v309_r438_*.py' -v
      - name: Inherited R437 strict first-holder and negative-root protocol
        run: python -m unittest discover -s tests -p 'test_v309_r437_*.py' -v
      - name: Inherited R436 strict R422 and R425 count parsing
        run: python -m unittest discover -s tests -p 'test_v309_r436_*.py' -v
      - name: Inherited R435 exact JVM owner/release protocol
        run: python -m unittest discover -s tests -p 'test_v309_r435_*.py' -v
      - name: Inherited R434 bounded startup
        run: python -m unittest discover -s tests -p 'test_v309_r434_*.py' -v
      - name: Inherited R433 R422-R425 actual public producer contracts
        run: python -m unittest discover -s tests -p 'test_v309_r433_*.py' -v
      - name: Inherited R432 private-chain mock acceptance gates
        run: python -m unittest discover -s tests -p 'test_v309_r432_*.py' -v
