name: V309 original Signlink 21 Java methods R186
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_signlink_twentyone_source_r186.py"
      - "tests/test_private_v309_signlink_twentyone_source_r186.py"
      - ".github/workflows/client-signlink-twentyone-source-r186.yml"
  workflow_dispatch:
jobs:
  selected-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_private_v309_signlink_twentyone_source_r186.py" -v
      - run: python -m unittest discover -s tests -p "test_private_v309_signlink_sixteen_source_r185.py" -v
      - run: python -m compileall -q src/spk_recovery/private_v309_signlink_twentyone_source_r186.py
