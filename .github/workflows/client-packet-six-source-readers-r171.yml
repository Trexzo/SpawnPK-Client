name: V309 original Packet six source readers R171
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_packet_six_readers_r171.py"
      - "tests/test_private_v309_packet_six_readers_r171.py"
      - ".github/workflows/client-packet-six-source-readers-r171.yml"
  workflow_dispatch:
jobs:
  packet-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - name: Verify six source-only original Packet JVM read methods
        run: python -m unittest discover -s tests -p "test_private_v309_packet_six_readers_r171.py" -v
      - name: R170 original Packet three methods and bit-exact runtime regression
        run: python -m unittest discover -s tests -p "test_private_v309_packet_three_methods_r170.py" -v
      - name: Python source syntax
        run: python -m compileall -q src/spk_recovery/private_v309_packet_six_readers_r171.py
