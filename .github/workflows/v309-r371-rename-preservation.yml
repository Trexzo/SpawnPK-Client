name: v309 R371 rename preservation receipt (synthetic only)
on:
  pull_request:
    paths:
      - '.github/workflows/v309-r371-rename-preservation.yml'
      - 'scripts/verify_v309_r371_rename_preservation.py'
      - 'tests/test_v309_r371_rename_preservation.py'
      - 'research/v309-source-recovery/r371-rename-preservation-witness.json'
      - 'docs/V309_R371_RENAME_PRESERVATION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-receipt-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Synthetic R371 private-source witness regression (no Java client)
        run: python -m unittest discover -s tests -p 'test_v309_r371_rename_preservation.py' -v
