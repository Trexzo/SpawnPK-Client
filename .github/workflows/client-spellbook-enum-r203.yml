name: V309 spellbook enum source R203
on:
  pull_request:
    paths:
      - 'src/spk_recovery/private_v309_spellbook_enum_r203.py'
      - 'tests/test_private_v309_spellbook_enum_r203.py'
      - '.github/workflows/client-spellbook-enum-r203.yml'
  workflow_dispatch:
jobs:
  source-parity:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_private_v309_spellbook_enum_r203.py -v
      - run: python -m unittest discover -s tests -p test_private_v309_original_callbacks_r202.py -v
