name: R356 v309 readable asset and UI helpers
on:
  pull_request:
    paths:
      - 'scripts/prepare_v309_r356_readable_asset_helpers.py'
      - 'tests/test_v309_r356_readable_asset_helpers.py'
      - 'docs/V309_R356_READABLE_ASSET_UI_PASS5.md'
      - '.github/workflows/v309-r356-readability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readable-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test synthetic inferred class, field, method and exact inverse checks
        run: python -m unittest discover -s tests -p 'test_v309_r356_readable_asset_helpers.py' -v
      - name: CLI help without raw private client source
        run: python scripts/prepare_v309_r356_readable_asset_helpers.py --help
      - name: Check source transformation syntax
        run: python -m py_compile scripts/prepare_v309_r356_readable_asset_helpers.py
