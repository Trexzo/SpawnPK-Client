name: V309 original Signlink six Java methods R183
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_signlink_six_source_r183.py"
      - "tests/test_private_v309_signlink_six_source_r183.py"
      - ".github/workflows/client-signlink-six-source-r183.yml"
  workflow_dispatch:
jobs:
  selected-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_private_v309_signlink_six_source_r183.py" -v
      - run: python -m unittest discover -s tests -p "test_private_v309_original_cipher_r182.py" -v
      - run: python -m compileall -q src/spk_recovery/private_v309_signlink_six_source_r183.py
