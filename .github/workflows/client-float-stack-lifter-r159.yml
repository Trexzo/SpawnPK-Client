name: V309 guarded float-array JVM stack to Java source R159
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_float_stack_lifter_r159.py"
      - "tests/test_private_v309_float_stack_lifter_r159.py"
      - ".github/workflows/client-float-stack-lifter-r159.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install source recovery tooling
        run: python -m pip install -e .
      - name: Recover float JVM bytecode into Java and recompile with real javac
        run: python -m unittest discover -s tests -p "test_private_v309_float_stack_lifter_r159.py" -v
      - name: Preserve R158 matrix quaternion and six-method source regressions
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_six_method_bundle_r158.py" -v
      - name: Python source syntax check
        run: python -m compileall -q src/spk_recovery/private_v309_float_stack_lifter_r159.py
