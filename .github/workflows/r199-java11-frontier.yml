name: R199 Java 11 diagnostic frontier
on:
  pull_request:
    paths:
      - 'tools/javac_frontier_r199.py'
      - 'tests/test_javac_frontier_r199.py'
      - '.github/workflows/r199-java11-frontier.yml'
  workflow_dispatch:
jobs:
  classify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Synthetic diagnostics classifier tests
        run: python -m unittest discover -s tests -p 'test_javac_frontier_r199.py' -v
