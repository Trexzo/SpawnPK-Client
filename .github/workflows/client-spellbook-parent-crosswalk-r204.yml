name: R204 Spellbook Parent Crosswalk
on:
  pull_request:
    paths:
      - 'src/spk_recovery/private_v309_spellbook_parent_crosswalk_r204.py'
      - 'tests/test_private_v309_spellbook_parent_crosswalk_r204.py'
      - '.github/workflows/client-spellbook-parent-crosswalk-r204.yml'
  workflow_dispatch:
jobs:
  synthetic:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_private_v309_spellbook_parent_crosswalk_r204.py -v
