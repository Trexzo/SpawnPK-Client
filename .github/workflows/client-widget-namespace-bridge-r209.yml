name: V309 widget Java namespace bridge R209
on:
  pull_request:
    paths:
      - 'src/spk_recovery/private_v309_widget_namespace_bridge_r209.py'
      - 'tests/test_private_v309_widget_namespace_bridge_r209.py'
      - '.github/workflows/client-widget-namespace-bridge-r209.yml'
  workflow_dispatch:
jobs:
  source-legalization:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_private_v309_widget_namespace_bridge_r209.py -v
      - run: python -m compileall -q src/spk_recovery/private_v309_widget_namespace_bridge_r209.py
