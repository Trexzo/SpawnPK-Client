name: V309 private AST JVM shape smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_source_jvm_shape_singletons_r127.py"
      - "src/spk_recovery/java/ClientAstStructuralShapesR127.java"
      - "tests/test_private_source_jvm_shape_singletons_r127.py"
      - ".github/workflows/client-source-shapes-r127.yml"
  workflow_dispatch:

concurrency:
  group: client-source-shapes-r127-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install package
        run: python -m pip install -e .
      - name: R127 compiled classfile versus source AST private-only fixture
        run: python -m unittest discover -s tests -p "test_private_source_jvm_shape_singletons_r127.py" -v
      - name: Python compile
        run: python -m compileall -q src/spk_recovery/private_source_jvm_shape_singletons_r127.py
