name: V309 one-command private callgraph pipeline smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_client_callgraph_pipeline_r133.py"
      - "tests/test_private_client_callgraph_pipeline_r133.py"
      - ".github/workflows/client-callgraph-pipeline-r133.yml"
  workflow_dispatch:

concurrency:
  group: client-callgraph-pipeline-r133-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install package
        run: python -m pip install -e .
      - name: Execute complete pinned synthetic source-JVM graph pipeline
        run: python -m unittest discover -s tests -p "test_private_client_callgraph_pipeline_r133.py" -v
      - name: Compile Python
        run: python -m compileall -q src/spk_recovery/private_client_callgraph_pipeline_r133.py
