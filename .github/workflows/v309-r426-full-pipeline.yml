name: v309-r426-full-pipeline-input-integrity
on:
  push:
    branches:
      - research/v309-r426-full-pipeline-integrity-fence
  pull_request:
    paths:
      - tools/r425/**
      - tools/r426/**
      - tests/test_v309_r426_*.py
      - .github/workflows/v309-r426-full-pipeline.yml
      - docs/V309_R426_BUILD_INPUT_INTEGRITY.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabricated-pipeline-and-drift-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Full fabricated source overlay -> Java11 compile -> exact class delta -> TEMP runtime acceptance + drift negatives
        run: python -m unittest discover -s tests -p 'test_v309_r426_*.py' -v
