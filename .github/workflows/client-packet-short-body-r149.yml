name: V309 Packet signed-short B source body parity R149 smoke
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_packet_signed_short_body_parity_r149.py"
      - "src/spk_recovery/java/PrivateSignedShortSourceSpansR149.java"
      - "tests/test_private_v309_packet_signed_short_body_parity_r149.py"
      - ".github/workflows/client-packet-short-body-r149.yml"
  workflow_dispatch:

concurrency:
  group: client-packet-short-r149-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install client source recovery package
        run: python -m pip install -e .
      - name: Compile exact synthetic original Java9 signed short and two recovered source candidates
        run: python -m unittest discover -s tests -p "test_private_v309_packet_signed_short_body_parity_r149.py" -v
      - name: Regression R148 float source call anchor
        run: python -m unittest discover -s tests -p "test_private_v309_packet_float_call_anchor_r148.py" -v
      - name: Syntax check
        run: python -m compileall -q src/spk_recovery/private_v309_packet_signed_short_body_parity_r149.py
