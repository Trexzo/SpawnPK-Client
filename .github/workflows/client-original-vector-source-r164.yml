name: V309 original vector Java source R164
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_original_vector_source_r164.py"
      - "src/spk_recovery/private_v309_vector_pipeline_r164.py"
      - "tests/test_private_v309_original_vector_source_r164.py"
      - ".github/workflows/client-original-vector-source-r164.yml"
  workflow_dispatch:
jobs:
  source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_private_v309_original_vector_source_r164.py" -v
      - run: python -m unittest discover -s tests -p "test_private_v309_source_tree_matrix_overlay_r163.py" -v
