name: V309 linked matrix Java method parity R150
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_matrix_source_method_parity_r150.py"
      - "tests/test_private_v309_matrix_source_method_parity_r150.py"
      - ".github/workflows/client-matrix-six-method-source-r150.yml"
  workflow_dispatch:

concurrency:
  group: v309-matrix-six-r150-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix-method-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install client source recovery tooling
        run: python -m pip install -e .
      - name: Verify original-linked Java matrix source methods and binary exclusion
        run: python -m unittest discover -s tests -p "test_private_v309_matrix_source_method_parity_r150.py" -v
      - name: Python syntax check
        run: python -m compileall -q src/spk_recovery/private_v309_matrix_source_method_parity_r150.py
