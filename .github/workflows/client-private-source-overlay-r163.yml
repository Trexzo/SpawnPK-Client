name: V309 recovered client Java source-tree overlay R163
on:
  pull_request:
    paths:
      - "src/spk_recovery/private_v309_source_tree_matrix_overlay_r163.py"
      - "tests/test_private_v309_source_tree_matrix_overlay_r163.py"
      - ".github/workflows/client-private-source-overlay-r163.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_private_v309_source_tree_matrix_overlay_r163.py" -v
      - run: python -m unittest discover -s tests -p "test_private_v309_complete_matrix_java_r162.py" -v
