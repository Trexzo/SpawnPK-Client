[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "spawnpk-client-recovery"
version = "0.1.0"
description = "Version-aware SpawnPK JVM client recovery, mapping, diffing and repackaging research tooling."
requires-python = ">=3.11"

[project.scripts]
spk-recovery = "spk_recovery.cli:main"
spk-corpus-audit = "spk_recovery.corpus_audit:main"
spk-field-proof-transfer = "spk_recovery.field_proof_cli:main"
spk-semantic-namespace = "spk_recovery.semantic_namespace_cli:main"
spk-readable-build = "spk_recovery.readable_build_cli:main"
spk-source-workspace = "spk_recovery.source_workspace_cli:main"
spk-coverage = "spk_recovery.coverage_cli:main"
spk-semantic-carry-forward = "spk_recovery.semantic_carryforward_cli:main"
spk-source-readiness = "spk_recovery.source_readiness_cli:main"
spk-build-authority = "spk_recovery.build_authority_cli:main"
spk-progressive-compile = "spk_recovery.progressive_compile_cli:main"
spk-clean-rebuild = "spk_recovery.clean_rebuild_cli:main"
spk-dependency-authority = "spk_recovery.dependency_authority:main"
spk-dependency-artifact-proof = "spk_recovery.dependency_artifact_proof:main"
spk-dependency-references = "spk_recovery.dependency_reference_surface:main"
spk-pom-authority = "spk_recovery.pom_authority:main"
spk-roundtrip-verify = "spk_recovery.roundtrip_verify_cli:main"
spk-source-symbols = "spk_recovery.source_symbols_cli:main"
spk-source-name-review = "spk_recovery.source_name_review_cli:main"
spk-source-name-carry-forward = "spk_recovery.source_name_carryforward_cli:main"
spk-source-name-plan = "spk_recovery.source_name_plan_cli:main"
spk-source-rewrite = "spk_recovery.source_rewrite_cli:main"
spk-source-rewrite-accept = "spk_recovery.source_rewrite_acceptance_cli:main"
spk-release-manifest = "spk_recovery.release_manifest_cli:main"
spk-release-build = "spk_recovery.release_orchestrator_cli:main"
spk-update-release = "spk_recovery.update_release_cli:main"
spk-release-verify = "spk_recovery.release_verify_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spk_recovery = ["java/*.java"]
